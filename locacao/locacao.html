<script>

/* =========================================================================

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(n,d=2)=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const d10=v=>v?String(v).slice(0,10):'';
const fmtD=v=>{v=d10(v);return v?v.split('-').reverse().join('/'):''};
const hoje=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());};
const addDias=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const difDias=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const maxD=(...a)=>a.filter(Boolean).sort().pop();
const minD=(...a)=>a.filter(Boolean).sort()[0];
const compDe=data=>d10(data).slice(0,7).replace('-','');           // 2026-10-09 -> 202610

const compFmt=c=>c?c.slice(4,6)+'/'+c.slice(0,4):'';
const compInput=c=>c.slice(0,4)+'-'+c.slice(4,6);                   // 202610 -> 2026-10 (input month)

const FTYPE={A:['db_Alpha','st_None'],N:['db_Numeric','st_None'],D:['db_Date','st_None'],P:['db_Float','st_Price'],Q:['db_Float','st_Quantity'],M:['db_Float','st_Measurement'],S:['db_Float','st_Sum'],T:['db_Memo','st_None']};
function fieldMD(table,f){
  const [Type,SubType]=FTYPE[f.t];
  const md={Name:f.n,Description:f.d.slice(0,30),TableName:table,Type,SubType};
  if(f.t==='A')md.EditSize=f.size;
  if(f.t==='N')md.EditSize=11;
  if(f.vv)md.ValidValuesMD=Object.entries(f.vv).map(([Value,Description])=>({Value,Description}));
  if(f.def)md.DefaultValue=f.def;
  return md;
}

/* =========================================================================
   Cliente da Service Layer
   ========================================================================= */
class ServiceLayer{
  constructor(base){this.base=String(base||'/b1s/v1').replace(/\/+$/,'');}
  async request(method,path,body,headers={}){
    const url=/^https?:/i.test(path)?path:this.base+'/'+String(path).replace(/^\/+/,'');
    const r=await fetch(url,{method,credentials:'include',headers:{'Content-Type':'application/json',...headers},body:body!=null?JSON.stringify(body):undefined});
    if(r.status===204)return null;
    const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
    if(!r.ok){
      const m=j&&j.error&&j.error.message;const e=new Error((typeof m==='string'?m:m&&m.value)||txt||r.statusText||('HTTP '+r.status));
      e.status=r.status;e.code=j&&j.error&&j.error.code;
      if(r.status===401&&!/^\/?Login/i.test(path))sessaoExpirada();
      throw e;
    }
    return j;
  }
  login(CompanyDB,UserName,Password){return this.request('POST','Login',{CompanyDB,UserName,Password});}
  logout(){return this.request('POST','Logout').catch(()=>null);}
  async getAll(path){
    let out=[],next=path,guard=0;
    while(next&&guard++<500){
      const j=await this.request('GET',next,null,{Prefer:'odata.maxpagesize=200'});
      out=out.concat((j&&j.value)||[]);
      next=j&&(j['odata.nextLink']||j['@odata.nextLink'])||null;
    }
    return out;
  }
}

/* Service Layer simulada (modo demonstração): mesmos endpoints, dados no navegador */
class MockServiceLayer extends ServiceLayer{
  constructor(){super('mock');this.key='sps_locacao_mock_v1';this.db=null;try{this.db=JSON.parse(localStorage.getItem(this.key));}catch(e){} if(!this.db)this.db=mockSeed();}
  persist(){try{localStorage.setItem(this.key,JSON.stringify(this.db));}catch(e){}}
  reset(){this.db=mockSeed();this.persist();}
  fail(status,message,code){const e=new Error(message);e.status=status;e.code=code;throw e;}
  keyOf(set){return {UserTablesMD:'TableName',UserObjectsMD:'Code',BusinessPartners:'CardCode',Items:'ItemCode'}[set]||(this.isDoc(set)?'DocEntry':'Code');}
  isDoc(set){return ['SPSLCTR','SPSLMOV','Drafts','Orders','Invoices'].includes(set);}
  async request(method,path,body,headers={}){
    await new Promise(r=>setTimeout(r,25));
    const [p,q='']=String(path).split('?');
    const m=p.match(/^([A-Za-z_0-9]+)(?:\((.*)\))?$/);if(!m)this.fail(404,'Recurso não encontrado: '+p);
    const set=m[1];const rawKey=m[2];
    if(set==='Login')return {SessionId:'mock-session',Version:'mock'};
    if(set==='Logout')return null;
    const db=this.db,coll=(db.sets[set]=db.sets[set]||[]),kf=this.keyOf(set);
    const key=rawKey==null?null:(/^'.*'$/.test(rawKey)?rawKey.slice(1,-1).replace(/''/g,"'"):+rawKey);
    const idx=key==null?-1:coll.findIndex(r=>r[kf]==key);
    const clone=o=>JSON.parse(JSON.stringify(o));
    if(method==='GET'){
      if(key!=null){if(idx<0)this.fail(404,'No matching records found (ODBC -2028)',-2028);return clone(coll[idx]);}
      let rows=coll;const params=Object.fromEntries(q.split('&').filter(Boolean).map(x=>{const i=x.indexOf('=');return [x.slice(0,i),decodeURIComponent(x.slice(i+1))];}));
      if(params.$filter){for(const c of params.$filter.matchAll(/(\w+) eq (?:'((?:[^']|'')*)'|(-?[\d.]+))/g)){const f=c[1],v=c[2]!=null?c[2].replace(/''/g,"'"):+c[3];rows=rows.filter(r=>r[f]==v);}}
      return {value:clone(rows)};
    }
    if(method==='POST'){
      const rec=clone(body||{});
      if(this.isDoc(set)){db.seq[set]=(db.seq[set]||0)+1;rec.DocEntry=db.seq[set];rec.DocNum=db.seq[set];
        for(const k in rec)if(Array.isArray(rec[k]))rec[k].forEach((l,i)=>{if(k==='DocumentLines')l.LineNum=i;else l.LineId=i+1;});}
      else{if(rec[kf]==null||rec[kf]==='')this.fail(400,'Chave obrigatória: '+kf);if(coll.some(r=>r[kf]==rec[kf]))this.fail(400,'This entry already exists in the following tables (ODBC -2035)',-2035);}
      if(set==='UserFieldsMD'){rec.FieldID=coll.filter(r=>r.TableName===rec.TableName).length;}
      coll.push(rec);this.persist();return clone(rec);
    }
    if(method==='PATCH'){
      if(idx<0)this.fail(404,'No matching records found (ODBC -2028)',-2028);
      const cur=coll[idx],replace=headers['B1S-ReplaceCollectionsOnPatch']==='true';
      for(const [k,v] of Object.entries(clone(body||{}))){
        if(Array.isArray(v)){
          const old=cur[k]||[];let maxId=old.reduce((a,l)=>Math.max(a,l.LineId||0),0);
          const novo=replace?[]:old;
          for(const l of v){const o=l.LineId!=null?old.find(x=>x.LineId===l.LineId):null;
            if(o){Object.assign(o,l);if(replace)novo.push(o);}else{l.LineId=++maxId;novo.push(l);}}

      }

    }
    if(method==='DELETE'){if(idx<0)this.fail(404,'No matching records found (ODBC -2028)',-2028);coll.splice(idx,1);this.persist();return null;}
    this.fail(405,'Método não suportado');
  }
}

/* Período cobrado de um item na competência. Regra: cobra-se do dia da saída
   até a véspera da devolução (mínimo 1 dia), limitado à vigência do contrato. */
function periodoLinha(c,l,comp){
  if(!l.U_DtSaida)return null;
  const r=compRange(comp),saida=d10(l.U_DtSaida);
  const ultimoDia=l.U_DtDevol?maxD(saida,addDias(d10(l.U_DtDevol),-1)):null;
  const ini=maxD(r.ini,d10(c.U_DtInicio),saida),fim=minD(r.fim,d10(c.U_DtFim),ultimoDia);
  if(!ini||!fim||ini>fim)return null;
  return {ini,fim,dias:difDias(ini,fim)+1,diasMes:r.dias};
}
function usoNaComp(ctrEntry,lineId,comp){
  return S.data.meds.filter(m=>m.U_CtrEntry==ctrEntry&&m.U_CtrLine==lineId&&m.U_Comp===comp)
    .reduce((s,m)=>s+Math.max(0,(+m.U_LeitFim||0)-(+m.U_LeitIni||0)),0);
}
function calcFaturamento(c,comp){
  const out={linhas:[],total:0,avisos:[]},prop=S.cfg.FRANQ_PROP!=='N';
  for(const l of c[LN]||[]){
    const p=periodoLinha(c,l,comp);if(!p)continue;
    const at=findAtivo(l.U_Ativo),un=UN(at&&at.U_Tipo),fator=p.dias/p.diasMes,valor=+l.U_Valor||0;
    let qtd,preco;
    if(c.U_Cobranca==='D'){qtd=p.dias;preco=valor;}else{qtd=1;preco=round2(valor*fator);}
    if(!l.U_ItemCode)out.avisos.push(`Ativo ${l.U_Ativo}: item de faturamento não informado.`);
    out.linhas.push({tipo:'LOC',ItemCode:l.U_ItemCode,qtd,preco,total:round2(qtd*preco),
      desc:`Locação ${l.U_Ativo} ${l.U_AtvDesc||''} ${fmtD(p.ini)} a ${fmtD(p.fim)} (${p.dias}${c.U_Cobranca==='D'?' diárias':'/'+p.diasMes+' dias'})`});
    const fr=(+l.U_Franquia||0)*(prop?fator:1),uso=usoNaComp(c.DocEntry,l.LineId,comp),exc=round2(Math.max(0,uso-fr));
    if(+l.U_Franquia>0&&+l.U_VlrExced>0&&exc>0)
      out.linhas.push({tipo:'EXC',ItemCode:l.U_ItemCode,qtd:exc,preco:+l.U_VlrExced,total:round2(exc*l.U_VlrExced),
        desc:`Excedente ${l.U_Ativo}: uso ${num(uso,1)} ${un}, franquia ${num(fr,1)} ${un}`});
  }
  for(const m of S.data.multas.filter(m=>m.U_Status==='REP'&&m.U_CtrEntry==c.DocEntry)){
    if(!S.cfg.ITEM_MULTA)out.avisos.push('Parâmetro "Item para repasse de multa" não configurado.');
    out.linhas.push({tipo:'MUL',ItemCode:S.cfg.ITEM_MULTA,qtd:1,preco:+m.U_Valor||0,total:round2(+m.U_Valor||0),multa:m.Code,
      desc:`Repasse multa AIT ${m.U_AIT||''} ${m.U_Placa||''} ${fmtD(m.U_DtInfr)}`});
  }
  out.total=round2(out.linhas.reduce((s,x)=>s+x.total,0));
  out.avisos=[...new Set(out.avisos)];
  return out;
}
function montarDocumento(c,comp,calc){
  const tipo=S.cfg.TIPO_DOC||'DRAFT';
  const doc={CardCode:c.U_CardCode,DocDate:hoje(),U_SPS_CtrEntry:c.DocEntry,U_SPS_Comp:comp,
    Comments:`Locação - contrato ${c.DocNum} - competência ${compFmt(comp)}${c.U_Obra?' - '+c.U_Obra:''}`.slice(0,254),
    DocumentLines:calc.linhas.map(x=>{const L={ItemCode:x.ItemCode,Quantity:x.qtd,UnitPrice:x.preco,FreeText:x.desc.slice(0,100)};if(+S.cfg.USAGE)L.Usage=+S.cfg.USAGE;return L;})};
  if(+c.U_Filial)doc.BPL_IDAssignedToInvoice=+c.U_Filial;
  if(tipo==='DRAFT')doc.DocObjectCode='oInvoices';
  if(tipo==='ORDER')doc.DocDueDate=hoje();
  return {tipo,set:DOCSET[tipo],doc};
}

/* Fatura um contrato numa competência. O registro em U_SPS_LFAT (Code = contrato-competência)
   é criado ANTES do documento e serve de trava: impede faturar duas vezes, mesmo com dois usuários. */
async function faturarContrato(c,comp){
  const calc=calcFaturamento(c,comp);
  if(!calc.linhas.length)throw new Error('nada a faturar na competência');
  if(calc.avisos.length)throw new Error(calc.avisos.join(' '));
  if(!c.U_CardCode)throw new Error('contrato sem cliente');
  const code=`${c.DocEntry}-${comp}`,trava={Code:code,Name:code,U_CtrEntry:c.DocEntry,U_Comp:comp,U_Status:'PRO',U_Data:hoje(),U_Valor:calc.total};
  try{await S.sl.request('POST',SET.FAT,trava);}
  catch(e){
    if(e.status!==400&&e.status!==409)throw e;
    let ex=null;try{ex=await S.sl.request('GET',`${SET.FAT}('${odq(code)}')`);}catch(_){throw e;}
    if(ex.U_Status!=='CAN')throw new Error(ex.U_Status==='OK'?`já faturado (documento ${ex.U_DocNum||ex.U_DocEntry})`:'faturamento em processamento por outro usuário');
    await S.sl.request('PATCH',`${SET.FAT}('${odq(code)}')`,{U_Status:'PRO',U_Data:hoje(),U_Valor:calc.total,U_DocEntry:0,U_DocNum:0});
  }
  const {tipo,set,doc}=montarDocumento(c,comp,calc);
  let criado;
  try{criado=await S.sl.request('POST',set,doc);}
  catch(e){await S.sl.request('PATCH',`${SET.FAT}('${odq(code)}')`,{U_Status:'CAN'}).catch(()=>{});throw e;}
  await S.sl.request('PATCH',`${SET.FAT}('${odq(code)}')`,{U_Status:'OK',U_DocType:tipo,U_DocEntry:criado.DocEntry,U_DocNum:criado.DocNum});
  for(const x of calc.linhas.filter(x=>x.multa))
    await S.sl.request('PATCH',`${SET.MUL}('${odq(x.multa)}')`,{U_Status:'FAT',U_Comp:comp});
  return {criado,tipo,total:calc.total};
}

/* Movimentação: saída, devolução e substituição. Atualiza o contrato, o ativo e,
   na devolução, registra a medição final do uso. */
async function registrarMovimento(mv){
  const c=findCtr(mv.ctr);if(!c)throw new Error('Selecione o contrato.');
  const l=c[LN].find(x=>x.LineId==mv.line);if(!l)throw new Error('Selecione o item do contrato.');
  const at=findAtivo(l.U_Ativo);if(!at)throw new Error('Ativo do item não encontrado: '+l.U_Ativo);
  if(!mv.data)throw new Error('Informe a data.');
  const leitura=+mv.med||0;
  if(mv.tipo==='SAI'){
    if(c.U_Status!=='ATV')throw new Error('O contrato precisa estar Ativo para registrar a saída.');
    if(l.U_StatusL!=='PEN')throw new Error('Item já saiu.');
    if(!['DIS','RES'].includes(statusAtivo(at)))throw new Error(`Ativo ${at.Code} está ${ST_ATV[at.U_Status]||at.U_Status}.`);
    if(d10(c.U_DtInicio)&&mv.data<d10(c.U_DtInicio))throw new Error('Data anterior ao início da vigência.');
  }else{
    if(l.U_StatusL!=='LOC')throw new Error('Item não está locado.');
    if(mv.data<d10(l.U_DtSaida))throw new Error('Data anterior à saída do item.');
    if(leitura<(+at.U_Medidor||0))throw new Error(`Leitura menor que a última registrada (${num(at.U_Medidor,1)}).`);
  }
  let novo=null;
  if(mv.tipo==='SUB'){
    novo=findAtivo(mv.novo);if(!novo)throw new Error('Selecione o ativo substituto.');
    if(statusAtivo(novo)!=='DIS'||alocacaoAberta(novo.Code))throw new Error(`Ativo ${novo.Code} não está disponível.`);
  }
  const movDoc={U_Tipo:mv.tipo,U_CtrEntry:c.DocEntry,U_CtrLine:l.LineId,U_CardName:c.U_CardName,U_Ativo:at.Code,U_AtivoNovo:novo?novo.Code:'',
    U_Data:mv.data,U_Medidor:leitura,U_MedidorN:+mv.medN||0,U_Combust:mv.comb||'',U_Checklist:JSON.stringify(mv.chk||{}),U_Avarias:mv.avarias||'',
    U_Respons:mv.resp||'',U_DocResp:mv.docResp||'',U_DestAtivo:mv.tipo==='SAI'?'LOC':(mv.dest||'DIS'),U_Assinatura:mv.sig||''};
  const criado=await S.sl.request('POST',SET.MOV,movDoc);
  if(mv.tipo==='SAI'){
    await S.sl.request('PATCH',`${SET.CTR}(${c.DocEntry})`,{[LN]:[{LineId:l.LineId,U_StatusL:'LOC',U_DtSaida:mv.data}]});
    await S.sl.request('PATCH',`${SET.ATV}('${odq(at.Code)}')`,{U_Status:'LOC',U_CtrAtual:c.DocEntry,U_Medidor:leitura||+at.U_Medidor||0});
  }else{
    if(leitura>(+at.U_Medidor||0)){
      const code=`${c.DocEntry}-${l.LineId}-${Date.now().toString(36)}`;
      await S.sl.request('POST',SET.MED,{Code:code,Name:code,U_CtrEntry:c.DocEntry,U_CtrLine:l.LineId,U_Ativo:at.Code,U_Comp:compDe(mv.data),U_Data:mv.data,U_LeitIni:+at.U_Medidor||0,U_LeitFim:leitura});
    }
    const linhas=[{LineId:l.LineId,U_StatusL:'DEV',U_DtDevol:mv.data}];
    if(novo)linhas.push({U_Ativo:novo.Code,U_AtvDesc:novo.Name,U_ItemCode:novo.U_ItemCode||l.U_ItemCode,U_Valor:+l.U_Valor||0,U_Franquia:+l.U_Franquia||0,
      U_VlrExced:+l.U_VlrExced||0,U_DtSaida:mv.data,U_DtDevol:null,U_Condutor:l.U_Condutor||'',U_StatusL:'LOC'});
    await S.sl.request('PATCH',`${SET.CTR}(${c.DocEntry})`,{[LN]:linhas});
    await S.sl.request('PATCH',`${SET.ATV}('${odq(at.Code)}')`,{U_Status:mv.dest==='MAN'?'MAN':'DIS',U_CtrAtual:0,U_Medidor:leitura||+at.U_Medidor||0});
    if(novo)await S.sl.request('PATCH',`${SET.ATV}('${odq(novo.Code)}')`,{U_Status:'LOC',U_CtrAtual:c.DocEntry,U_Medidor:+mv.medN||+novo.U_Medidor||0});
  }
  return criado;
}

/* Contrato que estava com o ativo na data/hora informada (para identificar multas). */
function contratoNaData(ativoCode,data){
  for(const c of S.data.contratos)for(const l of c[LN]){
    if(l.U_Ativo!==ativoCode||!l.U_DtSaida)continue;
    if(d10(l.U_DtSaida)<=data&&(!l.U_DtDevol||d10(l.U_DtDevol)>=data))return {c,l};
  }
  return null;
}

let _searchT;
function buscaDatalist(input,listId,kind){
  clearTimeout(_searchT);const q=input.value.trim();
  _searchT=setTimeout(async()=>{
    try{
      let rows;
      if(kind==='bp'){
        const f=q?`CardType eq 'cCustomer' and (contains(CardName,'${odq(q)}') or contains(CardCode,'${odq(q)}'))`:`CardType eq 'cCustomer'`;
        rows=(await S.sl.request('GET',qs('BusinessPartners',{$select:'CardCode,CardName,FederalTaxID',$filter:f,$top:20}))).value;
        rows=rows.filter(r=>!q||(r.CardName+' '+r.CardCode).toLowerCase().includes(q.toLowerCase()));
        $('#'+listId).innerHTML=rows.map(r=>`<option value="${esc(r.CardCode)} — ${esc(r.CardName)}"></option>`).join('');
      }else{
        const f=q?`contains(ItemName,'${odq(q)}') or contains(ItemCode,'${odq(q)}')`:`SalesItem eq 'tYES'`;
        rows=(await S.sl.request('GET',qs('Items',{$select:'ItemCode,ItemName',$filter:f,$top:20}))).value;
        rows=rows.filter(r=>!q||(r.ItemName+' '+r.ItemCode).toLowerCase().includes(q.toLowerCase()));
        $('#'+listId).innerHTML=rows.map(r=>`<option value="${esc(r.ItemCode)}">${esc(r.ItemName)}</option>`).join('');
      }
    }catch(e){console.warn('busca',e);}
  },300);
}

function lerEditorCtr(){
  const c=S.ctrEdit;
  $$('[data-cf]').forEach(e=>{const k=e.dataset.cf;if(k==='_bp'){if(!e.readOnly){const v=e.value.trim(),i=v.indexOf(' — ');c.U_CardCode=i>0?v.slice(0,i).trim():v;c.U_CardName=i>0?v.slice(i+3).trim():c.U_CardName;}}
    else c[k]=['U_DiaFat','U_Filial'].includes(k)?(+e.value||0):e.value;});
  $$('[data-lf]').forEach(e=>{const l=c[LN][+e.dataset.ln],k=e.dataset.lf;l[k]=['U_Valor','U_Franquia','U_VlrExced'].includes(k)?(+e.value||0):e.value;});
  return c;

async function validarBP(c){
  if(!c.U_CardCode)throw new Error('Informe o cliente.');
  try{const bp=await S.sl.request('GET',`BusinessPartners('${odq(c.U_CardCode)}')`);c.U_CardName=bp.CardName;}
  catch(e){if(e.status===404)throw new Error('Cliente não encontrado no B1: '+c.U_CardCode);throw e;}
}
function validarCtr(c,ativar){
  if(!c.U_DtInicio)throw new Error('Informe o início da vigência.');
  if(c.U_DtFim&&d10(c.U_DtFim)<d10(c.U_DtInicio))throw new Error('Fim da vigência anterior ao início.');
  if(+c.U_DiaFat<1||+c.U_DiaFat>31)throw new Error('Dia de faturamento deve estar entre 1 e 31.');
  for(const l of c[LN]){
    if(l.U_StatusL==='DEV')continue;
    const outro=alocacaoAberta(l.U_Ativo,c.DocEntry);if(outro)throw new Error(`Ativo ${l.U_Ativo} já está no contrato #${outro.DocNum}.`);
    if(ativar&&!l.U_ItemCode)throw new Error(`Ativo ${l.U_Ativo}: informe o item de faturamento.`);
    if(ativar&&!(+l.U_Valor>0))throw new Error(`Ativo ${l.U_Ativo}: informe o valor.`);
  }
  if(ativar&&!c[LN].length)throw new Error('Inclua ao menos um ativo.');
}
function payloadCtr(c){
  const p={};['U_CardCode','U_CardName','U_Tipo','U_DtInicio','U_DtFim','U_Cobranca','U_DiaFat','U_Status','U_Filial','U_Obra','U_Indice','U_Obs'].forEach(k=>p[k]=c[k]===''&&k.startsWith('U_Dt')?null:c[k]);
  p[LN]=c[LN].map(l=>{const o={};['LineId','U_Ativo','U_AtvDesc','U_ItemCode','U_Valor','U_Franquia','U_VlrExced','U_DtSaida','U_DtDevol','U_Condutor','U_StatusL'].forEach(k=>{if(l[k]!==undefined)o[k]=l[k]===''&&k.startsWith('U_Dt')?null:l[k];});return o;});
  return p;
}
async function salvarCtr(novoStatus){
  const c=lerEditorCtr();
  await acao(async()=>{
    try{
      await validarBP(c);
      const alvo=novoStatus||c.U_Status;
      if(alvo==='ENC'&&c[LN].some(l=>l.U_StatusL==='LOC'))throw new Error('Registre a devolução de todos os itens antes de encerrar.');
      validarCtr(c,alvo==='ATV');
      const p=payloadCtr(c);p.U_Status=alvo;
      if(alvo==='ENC'){p[LN]=p[LN].filter(l=>l.U_StatusL!=='PEN');if(!p.U_DtFim)p.U_DtFim=hoje();}
      let de=c.DocEntry;
      if(!de){const r=await S.sl.request('POST',SET.CTR,p);de=r.DocEntry;}
      else await S.sl.request('PATCH',`${SET.CTR}(${de})`,p,{'B1S-ReplaceCollectionsOnPatch':'true'});
      await loadAll();S.ctrEdit=JSON.parse(JSON.stringify(findCtr(de)));render();toast(alvo!==c.U_Status&&novoStatus?'Contrato '+ST_CTR[alvo].toLowerCase()+'.':'Contrato salvo.');
    }catch(e){msg('#ctrMsg','err',e.message);window.scrollTo(0,0);}
  });
}

function lerMov(){

  $$('[data-chko]').forEach(e=>{const k=e.dataset.chko;if(e.value||m.chk[k]){m.chk[k]=m.chk[k]||{};m.chk[k].o=e.value;}});
  const cv=$('#sig');if(cv&&cv.dataset.dirty==='1')m.sig=cv.toDataURL('image/png');
  return m;
}
function afterMov(){
  const cv=$('#sig');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#0A0A5E';
  if(S.mov.sig){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=S.mov.sig;cv.dataset.dirty='1';}
  let dw=false;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{dw=true;cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));};
  cv.onpointermove=e=>{if(!dw)return;ctx.lineTo(...pos(e));ctx.stroke();cv.dataset.dirty='1';};
  cv.onpointerup=cv.onpointercancel=()=>{dw=false;};
}

async function faturarSelecionados(){
  const ids=$$('.fatSel').filter(e=>e.checked).map(e=>e.value);
  if(!ids.length)return alert('Selecione ao menos um contrato.');
  if(!confirm(`Gerar ${ids.length} documento(s) no B1 (${DOCTYPES[S.cfg.TIPO_DOC]}) para ${compFmt(S.fatComp)}?`))return;
  const log=[];const out=()=>{$('#fatLog').innerHTML=`<h3>Resultado</h3><div class="log">${esc(log.join('\n'))}</div>`;};
  await busy(async()=>{
    for(const id of ids){
      const c=findCtr(id);
      try{const r=await faturarContrato(c,S.fatComp);log.push(`✓ Contrato #${c.DocNum} ${c.U_CardName}: ${DOCTYPES[r.tipo]} nº ${r.criado.DocNum} — ${brl(r.total)}`);}
      catch(e){log.push(`✗ Contrato #${c.DocNum} ${c.U_CardName}: ${e.message}`);}
      out();
    }
    await loadAll();
  });
  render();out();
}

async function salvarCfg(){
  await acao(async()=>{
    for(const e of $$('[data-cfg]')){
      const k=e.dataset.cfg,v=e.value;if(String(S.cfg[k]??'')===v)continue;
      try{await S.sl.request('PATCH',`${SET.CFG}('${k}')`,{U_Valor:v});}
      catch(err){if(err.status!==404)throw err;await S.sl.request('POST',SET.CFG,{Code:k,Name:k,U_Valor:v});}
    }
    toast('Parâmetros salvos.');await refresh();
  });
}
async function instalarEstruturas(){
  const log=[];const out=t=>{log.push(t);$('#instLog').innerHTML=`<div class="log">${esc(log.join('\n'))}</div>`;const l=$('#instLog .log');l.scrollTop=l.scrollHeight;};
  const sl=S.sl;let erros=0;
  await busy(async()=>{
    for(const t of SCHEMA.tables){
      try{await sl.request('GET',`UserTablesMD('${t.TableName}')`);out(`= tabela @${t.TableName} já existe`);}
      catch(e){if(e.status!==404){out(`✗ tabela @${t.TableName}: ${e.message}`);erros++;continue;}
        try{await sl.request('POST','UserTablesMD',t);out(`+ tabela @${t.TableName} criada`);}catch(e2){out(`✗ tabela @${t.TableName}: ${e2.message}`);erros++;}}
    }
    for(const [tab,fs] of Object.entries(SCHEMA.fields)){
      let exist=[];try{exist=(await sl.getAll(qs('UserFieldsMD',{$select:'Name,TableName',$filter:`TableName eq '${tab}'`}))).map(f=>f.Name);}catch(e){out(`✗ campos de ${tab}: ${e.message}`);erros++;continue;}
      for(const f of fs){
        if(exist.includes(f.n)){out(`= campo ${tab}.U_${f.n} já existe`);continue;}
        try{await sl.request('POST','UserFieldsMD',fieldMD(tab,f));out(`+ campo ${tab}.U_${f.n} criado`);}catch(e){out(`✗ campo ${tab}.U_${f.n}: ${e.message}`);erros++;}
      }
    }
    for(const u of SCHEMA.udos){
      try{await sl.request('GET',`UserObjectsMD('${u.Code}')`);out(`= objeto ${u.Code} já existe`);}
      catch(e){if(e.status!==404){out(`✗ objeto ${u.Code}: ${e.message}`);erros++;continue;}
        try{await sl.request('POST','UserObjectsMD',u);out(`+ objeto ${u.Code} criado`);}catch(e2){out(`✗ objeto ${u.Code}: ${e2.message}`);erros++;}}
    }
    for(const [k,v] of Object.entries(CFG_DEF)){
      try{await sl.request('GET',`${SET.CFG}('${k}')`);}catch(e){if(e.status===404){try{await sl.request('POST',SET.CFG,{Code:k,Name:k,U_Valor:v});out(`+ parâmetro ${k}`);}catch(e2){out(`· parâmetro ${k}: ${e2.message}`);}}}
    }
  });
  out(erros?`\nConcluído com ${erros} erro(s).`:'\nConcluído. Saia e entre novamente para usar as novas estruturas.');
}

function imprimir(titulo,corpo){
  const css=`body{font-family:Arial,sans-serif;font-size:12px;color:#111;margin:24px}h1{font-size:17px;margin:0 0 4px}h2{font-size:13px;margin:16px 0 6px;border-bottom:1px solid #999}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left}th{background:#eee}.r{text-align:right}.ass{margin-top:40px;display:flex;gap:40px}.ass div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${css}</style></head><body>${corpo}</body></html>`);d.close();
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),1500);},300);
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act],[data-open-ctr]');if(!t)return;
  if(t.dataset.tab){if(S.tab==='mov'&&S.mov)lerMov();return go(t.dataset.tab);}
  if(t.dataset.openCtr){ev.preventDefault();return abrirContrato(t.dataset.openCtr);}
  const a=t.dataset.act;
  switch(a){
    case 'closeModal':return closeModal();
    case 'novoAtivo':return formAtivo(null);
    case 'editAtivo':return formAtivo(JSON.parse(JSON.stringify(findAtivo(t.dataset.code))));
    case 'salvarAtivo':return salvarAtivo(t.dataset.novo==='1');
    case 'manut':return acao(async()=>{await S.sl.request('PATCH',`${SET.ATV}('${odq(t.dataset.code)}')`,{U_Status:t.dataset.st});await refresh();});
    case 'novoCtr':return abrirContrato(null);
    case 'voltarCtr':S.ctrEdit=null;return render();
    case 'salvarCtr':return salvarCtr(null);
    case 'statusCtr':{const st=t.dataset.st;if(st==='ENC'&&!confirm('Encerrar o contrato? Itens aguardando saída serão removidos.'))return;return salvarCtr(st);}
    case 'rmLinha':lerEditorCtr();S.ctrEdit[LN].splice(+t.dataset.i,1);return render();
    case 'printCtr':return imprimirCtr();
    case 'irMov':S.mov=novoMov(t.dataset.tipo,S.ctrEdit.DocEntry,t.dataset.line);S.ctrEdit=null;return go('mov');
    case 'limparSig':{const cv=$('#sig');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.dataset.dirty='';S.mov.sig='';return;}
    case 'cancelMov':S.mov=null;return render();
    case 'salvarMov':return salvarMov();
    case 'printMov':return imprimirMov(t.dataset.de);
    case 'regMed':return registrarMedicao(t);
    case 'fatToggle':{const d=+t.dataset.de;S.fatOpen.has(d)?S.fatOpen.delete(d):S.fatOpen.add(d);return render();}
    case 'faturarSel':return faturarSelecionados();
    case 'fatCancel':{if(!confirm('Confirme que o documento foi cancelado no B1. Liberar esta competência para novo faturamento?'))return;
      const f=S.data.fats.find(x=>x.Code===t.dataset.code);
      return acao(async()=>{await S.sl.request('PATCH',`${SET.FAT}('${odq(f.Code)}')`,{U_Status:'CAN'});
        for(const m of S.data.multas.filter(m=>m.U_Status==='FAT'&&m.U_CtrEntry==f.U_CtrEntry&&m.U_Comp===f.U_Comp))await S.sl.request('PATCH',`${SET.MUL}('${odq(m.Code)}')`,{U_Status:'REP',U_Comp:''});
        await refresh();});}
    case 'novaMulta':return formMulta();
    case 'salvarMulta':return salvarMulta();
    case 'stMulta':return acao(async()=>{await S.sl.request('PATCH',`${SET.MUL}('${odq(t.dataset.code)}')`,{U_Status:t.dataset.st});await refresh();});
    case 'salvarCfg':return salvarCfg();
    case 'instalar':if(!confirm('Criar/verificar as estruturas de locação no B1?'))return;return instalarEstruturas();
    case 'resetMock':if(!confirm('Apagar os dados de demonstração e restaurar o exemplo?'))return;S.sl.reset();S.ctrEdit=null;S.mov=null;return refresh();
  }
});
document.addEventListener('input',ev=>{
  const e=ev.target;
  if(e.dataset.search)return buscaDatalist(e,e.getAttribute('list'),e.dataset.search);
  if(e.dataset.fa){S.f.ativos[e.dataset.fa]=e.value;const pos=e.selectionStart;render();const n=$(`[data-fa="${e.dataset.fa}"]`);if(n&&n.tagName==='INPUT'){n.focus();n.setSelectionRange(pos,pos);}return;}
  if(e.dataset.fc){S.f.ctr[e.dataset.fc]=e.value;const pos=e.selectionStart;render();const n=$(`[data-fc="${e.dataset.fc}"]`);if(n&&n.tagName==='INPUT'){n.focus();n.setSelectionRange(pos,pos);}return;}
});
document.addEventListener('change',ev=>{
  const e=ev.target;
  if(e.dataset.mf&&['tipo','ctr','line','novo'].includes(e.dataset.mf)){lerMov();if(e.dataset.mf==='tipo'){S.mov.ctr='';S.mov.line='';S.mov.chk={};}if(e.dataset.mf==='ctr'){S.mov.line='';S.mov.chk={};}return render();}
  if(e.dataset.cf==='U_Cobranca'){lerEditorCtr();return render();}
  if(e.id==='fatComp'&&e.value){S.fatComp=e.value.replace('-','');S.fatOpen.clear();return render();}
  if(e.id==='medComp'&&e.value){S.medComp=e.value.replace('-','');return render();}
  if(e.id==='fatAll'){$$('.fatSel').forEach(x=>x.checked=e.checked);}
});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

/* ---------- login / logout ---------- */
function syncLoginModo(){const sl=$('#lgModo').value==='sl';$$('.slOnly').forEach(e=>e.hidden=!sl);}
$('#lgModo').onchange=syncLoginModo;
(function initLogin(){const l=lsGet();if(l.modo)$('#lgModo').value=l.modo;$('#lgUrl').value=l.url||'/b1s/v1';$('#lgDb').value=l.db||'';$('#lgUser').value=l.user||'';syncLoginModo();})();
$('#lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgBtn').click();});
$('#lgBtn').onclick=async()=>{
  const modo=$('#lgModo').value;msg('#lgMsg','info','conectando...');
  try{
    if(modo==='mock'){S.sl=new MockServiceLayer();S.mock=true;S.user='demo';S.db='DEMONSTRAÇÃO';}
    else{
      const url=$('#lgUrl').value.trim(),db=$('#lgDb').value.trim(),user=$('#lgUser').value.trim(),pass=$('#lgPass').value;
      if(!url||!db||!user||!pass)return msg('#lgMsg','err','Preencha URL, banco, usuário e senha.');
      S.sl=new ServiceLayer(url);S.mock=false;await S.sl.login(db,user,pass);S.user=user;S.db=db;
    }
    lsSet({modo,url:$('#lgUrl').value.trim(),db:$('#lgDb').value.trim(),user:$('#lgUser').value.trim()});
    $('#lgPass').value='';
    await busy(loadAll);
    $('#login').hidden=true;$('#app').hidden=false;$('#hdrInfo').textContent=`${S.db} · usuário ${S.user}`;$('#hdrMode').hidden=!S.mock;msg('#lgMsg','','');
    if(S.faltaEstrutura)S.tab='config';
    renderTabs();render();
  }catch(e){console.error(e);msg('#lgMsg','err','Falha ao conectar: '+(e.message||e)+(e instanceof TypeError?' — verifique a URL e o CORS/proxy da Service Layer.':''));}
};
function sair(){if(!INTEGRAR_B1)return;S.sl=null;S.ctrEdit=null;S.mov=null;$('#app').hidden=true;$('#login').hidden=false;}
$('#btnLogout').onclick=async()=>{if(S.sl)await S.sl.logout();sair();};
$('#btnReload').onclick=()=>refresh().catch(e=>alert(e.message));
async function iniciarDemo(){
  S.sl=new MockServiceLayer();S.mock=true;S.user='demo';S.db='Demonstração';
  await busy(loadAll);
  $('#login').hidden=true;$('#app').hidden=false;$('#hdrInfo').textContent='Dados de exemplo salvos neste navegador';$('#hdrMode').hidden=false;
  $('#btnLogout').hidden=true;renderTabs();render();
}
if(INTEGRAR_B1)$('#login').hidden=false;else iniciarDemo();
let _expirou=false;
function sessaoExpirada(){if(_expirou)return;_expirou=true;setTimeout(()=>{_expirou=false;},2000);alert('Sessão do B1 expirada. Entre novamente.');sair();}
</script>
