<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Áster Rental — Gestão de Locadoras</title>
<link rel="icon" href="img/logo-menu.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="busy" hidden></div>
<div id="toast"></div>

<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="img/logo.svg" alt="aster rental" class="logo" style="height:56px;margin-bottom:6px">
    <div class="sub" style="margin-bottom:16px">Gestão de locadoras integrada ao SAP Business One</div>
    <label for="lgUser">Usuário</label>
    <input id="lgUser" name="username" autocomplete="username" required>
    <label for="lgPass" style="margin-top:10px">Senha</label>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" style="width:100%;margin-top:16px" type="submit">Entrar</button>
    <div id="lgMsg"></div>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside id="side">
    <div class="side-top"><img src="img/logo-menu.svg" alt="aster rental" class="side-logo"><span class="spacer"></span><button id="sideToggle" title="Recolher menu" type="button">‹</button></div>
    <nav id="menu" class="side-menu"></nav>
    <div class="side-user"><div class="av"><svg class="ico" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
      <div><b id="userName"></b><small id="userProfile"></small></div></div>
  </aside>
  <section class="main">
    <div class="topbar"><button class="menu" id="sideOpen" title="Abrir menu" type="button">☰</button><h1 id="pageTitle"></h1><span class="spacer"></span><span id="modeBadge" class="modebadge" hidden>DEMONSTRAÇÃO</span></div>
    <div class="content"><main id="view"></main></div>
    <div class="actionbar"><button id="btnReload" class="primary" type="button">Atualizar</button><span class="spacer"></span><button id="btnPass" type="button">Trocar senha</button><button id="btnLogout" type="button">Sair</button></div>
  </section>
</div>

<div id="modalBg" hidden><div id="modal"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
