<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Importação — SPS</title>
<style>
:root{
  --navy:#0A0A5E; --navy2:#2A2A8C; --coral:#B0432A; --coralbg:#FBEDE8;
  --teal:#0A7A70; --tealbg:#E0F5F2; --blue:#0098C8; --bluebg:#E2F2FA;
  --amber:#9A6200; --amberbg:#FCF1DC;
  --ink:#1c1c2e; --muted:#5F5E6A; --line:#E3E1E8; --bg:#F6F6FA; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14.5px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
.brandbar{height:5px;background:linear-gradient(90deg,#00B0A6 0%,#0098C8 45%,#0A0A5E 100%);border-radius:3px;margin-bottom:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:12px}
.htitle{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:40px}
h1{font-size:19px;margin:0;color:var(--navy)}
h2{font-size:16px;color:var(--navy);margin:22px 0 10px}
h3{font-size:14px;color:var(--navy2);margin:18px 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.12s;display:inline-block;line-height:1.3}
button:hover,.btn:hover{background:#f0eef6;border-color:#cbc9d6}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{filter:brightness(1.15)}
button.danger{color:var(--coral)}
button.mini{font-size:12px;padding:3px 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
nav button{border-radius:20px;padding:7px 15px;font-weight:500;color:var(--navy2)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:650;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.warn .v{color:var(--coral)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pipe div{border-radius:10px;padding:10px 12px;cursor:pointer;border:1px solid transparent}
.pipe div:hover{border-color:var(--line)}
.pipe b{display:block;font-size:20px}
.pipe span{font-size:12px}
.g-rascunho{background:#eeedf3;color:#4b4a57}
.g-prep{background:var(--bluebg);color:#04608a}
.g-transito{background:#E8E6F8;color:var(--navy2)}
.g-aduana{background:var(--amberbg);color:var(--amber)}
.g-liberado{background:var(--tealbg);color:var(--teal)}
.g-encerrado{background:#e6e6ea;color:#3c3c48}
.g-cancelado{background:var(--coralbg);color:var(--coral)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.c-verde{background:#DDF3E4;color:#1d7a3e}.c-amarelo{background:#FFF3C4;color:#8a6a00}.c-vermelho{background:var(--coralbg);color:var(--coral)}.c-cinza{background:#e4e4e8;color:#444}
.lv-alto{background:var(--coralbg);color:var(--coral)}.lv-medio{background:var(--amberbg);color:var(--amber)}.lv-info{background:var(--bluebg);color:#04608a}.lv-ok{background:var(--tealbg);color:var(--teal)}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid #f0eef6;cursor:pointer;flex-wrap:wrap}
.alerts li:hover{background:#faf9fd}
.alerts .pn{font-weight:600;color:var(--navy);min-width:110px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f4f3fb;color:var(--navy2);font-weight:600;text-align:left;padding:8px 9px;white-space:nowrap;font-size:12px}
td{padding:6px 9px;border-top:1px solid #f0eef6;vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#faf9fd}
tfoot td{font-weight:650;background:#fafafd}
td.empty{text-align:center;color:var(--muted);padding:18px}
.grid td{padding:4px 5px}
.grid input,.grid select{min-width:70px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d9f0;border-color:var(--blue)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal)}
input.w-s{min-width:60px;width:70px}input.w-m{min-width:110px}input.w-l{min-width:190px}
textarea{min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld.wide{grid-column:1/-1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input,.filters select{width:auto;min-width:150px;flex:1 1 150px}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.phead h2{margin:0;font-size:20px}
.phead .meta{color:var(--muted);font-size:13px}
.steps{display:flex;gap:0;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px}
.step{flex:1 0 96px;text-align:center;position:relative;font-size:11.5px;color:var(--muted);padding:0 4px}
.step:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.step:first-child:before{display:none}
.step .dot{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 4px;position:relative;z-index:1;font-size:12px;line-height:18px;font-weight:700;color:#fff}
.step.done .dot{background:var(--teal);border-color:var(--teal)}
.step.done:before,.step.cur:before{background:var(--teal)}
.step.cur .dot{background:var(--navy);border-color:var(--navy)}
.step.done,.step.cur{color:var(--ink)}
.step .dt{display:block;color:var(--muted);font-size:11px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.subtabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:500;padding:8px 12px}
.subtabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sum table td{border-top:1px solid #f0eef6}
.sum tr.tot td{font-weight:700;color:var(--navy);border-top:2px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px solid #f0eef6;font-size:13px}
.log .d{color:var(--muted);font-size:12px;margin-right:8px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state button{margin-top:10px}
@media print{
  nav,.toolbar,.subtabs,.noprint,button{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card,.tw{border:none;padding:0}
  input,select,textarea{border:none;padding:0;background:transparent}
  h2.ptitle{page-break-after:avoid}
}

<script>
// ===================== Constantes =====================
const STORE='sps_importacao_v1';
const MODAIS={maritimo:'Marítimo',aereo:'Aéreo',rodoviario:'Rodoviário'};
const INCOTERMS=['EXW','FCA','FAS','FOB','CFR','CIF','CPT','CIP','DAP','DPU','DDP'];
const MOEDAS=['USD','EUR','CNY','GBP','JPY','CHF','BRL'];
const CANAIS={'':'—',verde:'Verde',amarelo:'Amarelo',vermelho:'Vermelho',cinza:'Cinza'};
const TIPOS_AG=['Despachante','Agente de carga','Transportadora','Armazém / recinto','Seguradora','Banco / corretora'];
const TIPOS_PG=['Antecipado','Saldo','Frete internacional','Seguro','Outro'];
const STAGES=[
  {k:'pedido',t:'Pedido emitido',g:'prep'},
  {k:'pronto',t:'Carga pronta',g:'prep'},
  {k:'embarque',t:'Embarcado',g:'transito'},
  {k:'chegada',t:'Chegada / presença de carga',g:'aduana'},
  {k:'registro',t:'DUIMP/DI registrada',g:'aduana'},
  {k:'desembaraco',t:'Desembaraçado',g:'liberado'},
  {k:'entrega',t:'Entregue',g:'liberado'},
  {k:'encerrado',t:'Encerrado (custos fechados)',g:'encerrado'}];
const GROUPS={rascunho:'Rascunho',prep:'Em preparação',transito:'Em trânsito',aduana:'Na aduana',liberado:'Liberado / entrega',encerrado:'Encerrado',cancelado:'Cancelado'};
// req = etapa a partir da qual o documento é exigido
const DOCS=[
  {k:'proforma',t:'Proforma invoice',req:'pedido'},
  {k:'invoice',t:'Commercial invoice',req:'embarque'},
  {k:'packing',t:'Packing list',req:'embarque'},
  {k:'bl',t:'Conhecimento (BL / AWB / CRT)',req:'embarque'},
  {k:'origem',t:'Certificado de origem',req:null},
  {k:'li',t:'LI / LPCO (anuências)',req:null},
  {k:'seguro',t:'Apólice / averbação de seguro',req:null},
  {k:'duimp',t:'Extrato DUIMP / DI',req:'registro'},
  {k:'icms',t:'Comprovante ICMS / GNRE',req:'desembaraco'},
  {k:'nf',t:'NF de entrada',req:'entrega'}];

// ===================== Estado / persistência =====================
function blank(){return {seq:0,processos:[],fornecedores:[],ncms:[],agentes:[],
  config:{afrmm:8,siscomex:154.23,icms:18,freeTime:7,alertaEta:7,capatazNoVA:true}};}
function migrate(d){const b=blank();d.config=Object.assign(b.config,d.config||{});
  ['processos','fornecedores','ncms','agentes'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  d.seq=d.seq||0;
  d.processos.forEach(p=>{['itens','pagamentos','log'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[];});['custos','etapas','docs'].forEach(k=>{if(!p[k]||typeof p[k]!=='object')p[k]={};});});
  return d;}
function load(){try{const s=localStorage.getItem(STORE);if(s)return migrate(JSON.parse(s));}catch(e){}return blank();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));}catch(e){alert('Não foi possível salvar no navegador: '+e.message);}}
let db=load();
let ui={view:'painel',pid:null,sub:'geral',cad:'fornecedores',cx:'abertos',f:{q:'',grp:'ativos',modal:'',forn:''}};

// ===================== Utilitários =====================
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v)||0;
const NF2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>'R$ '+NF2.format(v||0);
const mo=(v,m)=>(m||'')+' '+NF2.format(v||0);
const pct=v=>NF2.format(v||0)+'%';
const fd=s=>s?s.split('-').reverse().join('/'):'—';
function hoje(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function agora(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16).replace('T',' ');}
const diasAte=s=>Math.round((Date.parse(s)-Date.parse(hoje()))/864e5);
const diasEntre=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
function addDias(s,k){const d=new Date(Date.parse(s)+k*864e5);return d.toISOString().slice(0,10);}
function getPath(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],db);}
function setPath(path,v){const ks=path.split('.');let o=db;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;}
const forn=id=>db.fornecedores.find(f=>f.id===id);
const agente=id=>db.agentes.find(a=>a.id===id);
const stageIndex=k=>STAGES.findIndex(s=>s.k===k);
function stageIdx(p){let i=-1;STAGES.forEach((s,k)=>{if(p.etapas&&p.etapas[s.k])i=k;});return i;}
function grp(p){if(p.cancelado)return 'cancelado';const i=stageIdx(p);return i<0?'rascunho':STAGES[i].g;}
function statusTxt(p){if(p.cancelado)return 'Cancelado';const i=stageIdx(p);return i<0?'Rascunho':STAGES[i].t;}
const ativo=p=>!p.cancelado&&!(p.etapas&&p.etapas.encerrado);
const pill=p=>`<span class="pill g-${grp(p)}">${esc(statusTxt(p))}</span>`;
const canalPill=c=>c?`<span class="pill c-${c}">${CANAIS[c]}</span>`:'<span class="note">—</span>';

// ----- campos de formulário (data-b = caminho no db) -----
function inp(path,val,o={}){
  const t=o.type||'text';
  const ty=t==='num'?'type="number" step="any" inputmode="decimal" data-t="num"':`type="${t}"`;
  return `<input data-b="${path}" ${ty} value="${esc(val??'')}"${o.ph!=null?` placeholder="${esc(o.ph)}"`:''}${o.list?` list="${o.list}"`:''}${o.cls?` class="${o.cls}"`:''}>`;}
function sel(path,val,opts,o={}){
  return `<select data-b="${path}"${o.cls?` class="${o.cls}"`:''}>`+opts.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`).join('')+'</select>';}
const chk=(path,val)=>`<input type="checkbox" data-b="${path}" data-t="bool"${val?' checked':''}>`;
const ta=(path,val)=>`<textarea data-b="${path}">${esc(val??'')}</textarea>`;
const fld=(label,html,cls='')=>`<div class="fld ${cls}"><label>${label}</label>${html}</div>`;
const optsArr=a=>a.map(x=>[x,x]);
const optsObj=o=>Object.entries(o);

// ===================== Cálculo de custos =====================
// Base: Valor aduaneiro (VA) = FOB + frete + seguro (+ capatazia, se configurado), convertidos pela taxa da DUIMP/DI.
// II = VA×II% · IPI = (VA+II)×IPI% · PIS/COFINS = VA×alíq · ICMS "por dentro" sobre VA+tributos+despesas aduaneiras (Siscomex, AFRMM).
function calc(p){
  const c=db.config,cu=p.custos||{};
  const tx=p.moeda==='BRL'?1:n(p.taxa);
  const itens=p.itens||[];
  const fob=itens.reduce((s,i)=>s+n(i.qtd)*n(i.vu),0);
  const fobBRL=fob*tx,freteBRL=n(cu.frete)*tx,seguroBRL=n(cu.seguro)*tx,capat=n(cu.capatazia);
  const va=fobBRL+freteBRL+seguroBRL+(c.capatazNoVA?capat:0);
  const has=v=>v!=null&&v!=='';
  const afrmm=has(cu.afrmm)?n(cu.afrmm):(p.modal==='maritimo'?freteBRL*n(c.afrmm)/100:0);
  const siscomex=has(cu.siscomex)?n(cu.siscomex):n(c.siscomex);
  const outras=n(cu.armazenagem)+n(cu.despachante)+n(cu.sda)+n(cu.freteNac)+n(cu.outros)+(c.capatazNoVA?0:capat);
  const T={tx,fob,fobBRL,freteBRL,seguroBRL,capat,va,afrmm,siscomex,outras,ii:0,ipi:0,pis:0,cofins:0,icms:0,itens:[]};
  itens.forEach(it=>{
    const f=n(it.qtd)*n(it.vu),sh=fob?f/fob:1/itens.length;
    const vai=va*sh,ii=vai*n(it.ii)/100,ipi=(vai+ii)*n(it.ipi)/100,pis=vai*n(it.pis)/100,cof=vai*n(it.cofins)/100;
    const da=(afrmm+siscomex)*sh,ali=Math.min(n(it.icms),99)/100;
    const icms=(vai+ii+ipi+pis+cof+da)/(1-ali)*ali;
    const out=outras*sh,total=vai+ii+ipi+pis+cof+icms+da+out,cred=ipi+pis+cof+icms,q=n(it.qtd);
    T.ii+=ii;T.ipi+=ipi;T.pis+=pis;T.cofins+=cof;T.icms+=icms;
    T.itens.push({it,sh,vai,ii,ipi,pis,cofins:cof,icms,trib:ii+ipi+pis+cof+icms,desp:da+out,total,cred,unit:q?total/q:0,unitLiq:q?(total-cred)/q:0});
  });
  T.trib=T.ii+T.ipi+T.pis+T.cofins+T.icms;
  T.total=itens.length?T.itens.reduce((s,x)=>s+x.total,0):va+afrmm+siscomex+outras;
  T.cred=T.ipi+T.pis+T.cofins+T.icms;T.liq=T.total-T.cred;T.fator=fobBRL?T.total/fobBRL:0;
  return T;}

// ===================== Alertas =====================
function alertas(p){
  const A=[],c=db.config;if(!ativo(p))return A;
  const e=p.etapas||{},si=stageIdx(p),add=(lvl,msg)=>A.push({lvl,msg,p});
  if(!e.chegada&&p.eta){const d=diasAte(p.eta);
    if(d<0)add('alto',`ETA vencido há ${-d} dia(s) sem registro de chegada`);
    else if(d<=n(c.alertaEta))add('medio',`Chegada prevista em ${d} dia(s) (${fd(p.eta)})`);}
  if(e.chegada&&!e.entrega){const ft=p.freeTime!=null&&p.freeTime!==''?n(p.freeTime):n(c.freeTime);const lim=addDias(e.chegada,ft),d=diasAte(lim);
    if(d<0)add('alto',`Free time estourado há ${-d} dia(s) — risco de demurrage/armazenagem extra`);
    else if(d<=3)add('medio',`Free time vence em ${d} dia(s) (${fd(lim)})`);}
  if(!e.desembaraco&&(p.canal==='vermelho'||p.canal==='cinza'))add('alto',`Canal ${CANAIS[p.canal].toLowerCase()} — acompanhar conferência`);
  if(!e.desembaraco&&p.canal==='amarelo')add('medio','Canal amarelo — conferência documental');
  (p.pagamentos||[]).forEach(pg=>{if(pg.pago||!pg.venc)return;const d=diasAte(pg.venc);
    if(d<0)add('alto',`Pagamento ${(pg.tipo||'').toLowerCase()} de ${mo(pg.valor,p.moeda)} vencido há ${-d} dia(s)`);
    else if(d<=7)add('medio',`Pagamento ${(pg.tipo||'').toLowerCase()} de ${mo(pg.valor,p.moeda)} vence em ${d} dia(s)`);});
  const pend=DOCS.filter(d=>d.req&&si>=stageIndex(d.req)&&!(p.docs[d.k]&&p.docs[d.k].ok));
  if(pend.length)add('medio','Documentos pendentes: '+pend.map(d=>d.t).join(', '));
  if(si>=stageIndex('registro')&&p.moeda!=='BRL'&&!n(p.taxa))add('info','Informe a taxa de câmbio da DUIMP/DI para fechar os custos');
  if(si>=0&&!(p.itens||[]).length)add('info','Processo sem itens cadastrados');
  return A;}
const LVORD={alto:0,medio:1,info:2};
function todosAlertas(){return db.processos.flatMap(alertas).sort((a,b)=>LVORD[a.lvl]-LVORD[b.lvl]);}

// ===================== Render principal =====================
const VIEWS=[['painel','Painel'],['processos','Processos'],['cambio','Câmbio & pagamentos'],['relatorios','Relatórios'],['cadastros','Cadastros']];
function render(){
  document.getElementById('nav').innerHTML=VIEWS.map(([k,t])=>`<button class="${(ui.view===k||(ui.view==='processo'&&k==='processos'))?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  const V={painel:vPainel,processos:vLista,processo:vProc,cambio:vCambio,relatorios:vRel,cadastros:vCad}[ui.view]||vPainel;
  document.getElementById('main').innerHTML=V()+datalists();}
function datalists(){
  return `<datalist id="dl-ncm">${db.ncms.map(x=>`<option value="${esc(x.codigo)}">${esc(x.descricao||'')}</option>`).join('')}</datalist>`+
  `<datalist id="dl-pais">${['China','Estados Unidos','Alemanha','Itália','Japão','Coreia do Sul','Índia','México','Argentina','França','Espanha','Taiwan','Vietnã','Reino Unido','Suíça'].map(x=>`<option value="${x}">`).join('')}</datalist>`+
  `<datalist id="dl-un">${['UN','PC','KG','M','M2','M3','L','CX','JG','PAR'].map(x=>`<option value="${x}">`).join('')}</datalist>`;}
window.go=v=>{ui.view=v;render();window.scrollTo(0,0);};
window.abrir=id=>{ui.pid=id;ui.view='processo';if(ui.sub==='all')ui.sub='geral';render();window.scrollTo(0,0);};

// ----- Painel -----
function vPainel(){
  if(!db.processos.length)return `<div class="card empty-state"><h2>Nenhum processo de importação ainda</h2>
    <p>Crie o primeiro processo, cadastre fornecedores e NCMs, ou carregue um exemplo para conhecer o sistema.</p>
    <button class="primary" onclick="novoProc()">+ novo processo</button> <button onclick="seed()">carregar dados de exemplo</button></div>`;
  const at=db.processos.filter(ativo);
  const cnt=g=>db.processos.filter(p=>grp(p)===g).length;
  const transAd=at.filter(p=>['transito','aduana'].includes(grp(p)));
  const vTrans=transAd.reduce((s,p)=>s+calc(p).va,0);
  let pag30=0,pagVenc=0;
  db.processos.forEach(p=>{if(p.cancelado)return;(p.pagamentos||[]).forEach(pg=>{if(pg.pago||!pg.venc)return;const d=diasAte(pg.venc),v=n(pg.valor)*(p.moeda==='BRL'?1:n(pg.taxa)||n(p.taxa));if(d<0)pagVenc+=v;else if(d<=30)pag30+=v;});});
  const al=todosAlertas();const altos=al.filter(a=>a.lvl==='alto').length;
  const enc=db.processos.filter(p=>p.etapas.pedido&&p.etapas.entrega);
  const lead=enc.length?enc.reduce((s,p)=>s+diasEntre(p.etapas.pedido,p.etapas.entrega),0)/enc.length:null;
  const prox=at.filter(p=>p.eta&&!p.etapas.chegada).sort((a,b)=>a.eta.localeCompare(b.eta)).slice(0,8);
  return `<div class="kpis">
    <div class="kpi"><div class="l">Processos ativos</div><div class="v">${at.length}</div><div class="s">${db.processos.length} no total</div></div>
    <div class="kpi"><div class="l">Em trânsito / na aduana</div><div class="v">${transAd.length}</div><div class="s">VA ${brl(vTrans)}</div></div>
    <div class="kpi ${altos?'warn':''}"><div class="l">Alertas críticos</div><div class="v">${altos}</div><div class="s">${al.length} alertas no total</div></div>
    <div class="kpi ${pagVenc?'warn':''}"><div class="l">Pagamentos vencidos</div><div class="v">${brl(pagVenc)}</div><div class="s">a vencer em 30 dias: ${brl(pag30)}</div></div>
    <div class="kpi"><div class="l">Lead time médio</div><div class="v">${lead==null?'—':Math.round(lead)+' d'}</div><div class="s">pedido → entrega (${enc.length} proc.)</div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">Pipeline</h3><div class="pipe">${Object.entries(GROUPS).map(([g,t])=>`<div class="g-${g}" onclick="ui.f.grp='${g}';go('processos')"><b>${cnt(g)}</b><span>${t}</span></div>`).join('')}</div></div>
  <div class="card"><h3 style="margin-top:0">Alertas</h3>${al.length?`<ul class="alerts">${al.map(a=>`<li onclick="abrir('${a.p.id}')"><span class="pill lv-${a.lvl}">${{alto:'crítico',medio:'atenção',info:'info'}[a.lvl]}</span><span class="pn">${esc(a.p.numero)}</span><span>${esc(a.msg)}</span></li>`).join('')}</ul>`:'<p class="note">Nenhum alerta. Tudo em dia.</p>'}</div>
  <div class="card"><h3 style="margin-top:0">Próximas chegadas</h3>${prox.length?`<div class="tw"><table><thead><tr><th>Processo</th><th>Fornecedor</th><th>Modal</th><th>Conhecimento</th><th>ETA</th><th class="r">Dias</th><th>Status</th></tr></thead><tbody>${prox.map(p=>{const d=diasAte(p.eta);return `<tr class="click" onclick="abrir('${p.id}')"><td><b>${esc(p.numero)}</b></td><td>${esc((forn(p.fornecedorId)||{}).nome||'—')}</td><td>${MODAIS[p.modal]||'—'}</td><td>${esc(p.conhecimento||'—')}</td><td>${fd(p.eta)}</td><td class="r">${d<0?`<span class="pill lv-alto">${d}</span>`:d}</td><td>${pill(p)}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="note">Nenhuma chegada prevista registrada.</p>'}</div>`;}

// ----- Lista de processos -----
function filtrados(){
  const f=ui.f,q=f.q.trim().toLowerCase();
  return db.processos.filter(p=>{
    if(f.grp==='ativos'&&!ativo(p))return false;
    if(f.grp&&f.grp!=='ativos'&&grp(p)!==f.grp)return false;
    if(f.modal&&p.modal!==f.modal)return false;
    if(f.forn&&p.fornecedorId!==f.forn)return false;
    if(q){const hay=[p.numero,p.ref,p.po,p.invoice,p.conhecimento,p.duimp,p.containers,p.veiculo,(forn(p.fornecedorId)||{}).nome,...(p.itens||[]).map(i=>(i.cod||'')+' '+(i.desc||'')+' '+(i.ncm||''))].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;});}
function vLista(){
  const f=ui.f;
  return `<div class="filters">
    <input data-ui="q" placeholder="Buscar nº, PO, invoice, BL, DUIMP, item, NCM…" value="${esc(f.q)}">
    <select data-ui="grp"><option value="">Todos os status</option><option value="ativos"${f.grp==='ativos'?' selected':''}>Somente ativos</option>${Object.entries(GROUPS).map(([k,t])=>`<option value="${k}"${f.grp===k?' selected':''}>${t}</option>`).join('')}</select>
    <select data-ui="modal"><option value="">Todos os modais</option>${Object.entries(MODAIS).map(([k,t])=>`<option value="${k}"${f.modal===k?' selected':''}>${t}</option>`).join('')}</select>
    <select data-ui="forn"><option value="">Todos os fornecedores</option>${db.fornecedores.map(x=>`<option value="${x.id}"${f.forn===x.id?' selected':''}>${esc(x.nome||'(sem nome)')}</option>`).join('')}</select>
    <button onclick="csvProcessos()">⤓ CSV</button>
  </div><div id="plist">${listaBody()}</div>`;}
function listaBody(){
  const L=filtrados();
  if(!L.length)return `<div class="card empty-state">Nenhum processo encontrado.<br><button class="primary" onclick="novoProc()">+ novo processo</button></div>`;
  return `<div class="tw"><table><thead><tr><th>Processo</th><th>Fornecedor</th><th>Modal</th><th>PO / Invoice</th><th>ETA</th><th>Status</th><th>Canal</th><th class="r">Valor aduaneiro</th><th class="r">Custo total</th><th>Alertas</th></tr></thead><tbody>${L.map(p=>{const T=calc(p),a=alertas(p),hi=a.some(x=>x.lvl==='alto');
    return `<tr class="click" onclick="abrir('${p.id}')"><td><b>${esc(p.numero)}</b>${p.ref?`<div class="note" style="margin:0">${esc(p.ref)}</div>`:''}</td><td>${esc((forn(p.fornecedorId)||{}).nome||'—')}</td><td>${MODAIS[p.modal]||'—'}</td><td>${esc([p.po,p.invoice].filter(Boolean).join(' / ')||'—')}</td><td>${fd(p.eta)}</td><td>${pill(p)}</td><td>${canalPill(p.canal)}</td><td class="r">${brl(T.va)}</td><td class="r">${brl(T.total)}</td><td>${a.length?`<span class="pill lv-${hi?'alto':'medio'}">${a.length}</span>`:''}</td></tr>`;}).join('')}</tbody></table></div><p class="note">${L.length} processo(s).</p>`;}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.ui;if(!k)return;ui.f[k]=e.target.value;const h=document.getElementById('plist');if(h)h.innerHTML=listaBody();});

// ----- Detalhe do processo -----
const SUBS=[['geral','Dados gerais'],['itens','Itens & custos'],['etapas','Etapas & prazos'],['docs','Documentos'],['cambio','Câmbio'],['hist','Histórico']];
function vProc(){
  const idx=db.processos.findIndex(x=>x.id===ui.pid);
  if(idx<0){ui.view='processos';return vLista();}
  const p=db.processos[idx],P='processos.'+idx,T=calc(p),si=stageIdx(p),al=alertas(p);
  const fn=forn(p.fornecedorId);
  let h=`<div class="phead"><div><h2>${esc(p.numero)} ${pill(p)} ${p.canal?canalPill(p.canal):''}</h2>
    <div class="meta">${esc(fn?fn.nome:'Fornecedor não informado')} · ${MODAIS[p.modal]||'—'} · ${esc(p.incoterm||'—')} · ${esc(p.moeda||'')} · criado em ${fd(p.criado)}</div></div>
    <div class="row noprint"><button onclick="go('processos')">← voltar</button><button onclick="duplicar('${p.id}')">duplicar</button><button onclick="imprimir()">imprimir</button>
    <button onclick="cancelar('${p.id}')">${p.cancelado?'reativar':'cancelar'}</button><button class="danger" onclick="excluir('${p.id}')">excluir</button></div></div>`;
  h+=`<div class="steps">${STAGES.map((s,i)=>`<div class="step ${p.etapas[s.k]?'done':''} ${i===si+1&&!p.cancelado?'cur':''}"><div class="dot">${p.etapas[s.k]?'✓':''}</div>${s.t}<span class="dt">${p.etapas[s.k]?fd(p.etapas[s.k]):''}</span></div>`).join('')}</div>`;
  if(al.length)h+=`<div class="card" style="padding:10px 14px"><ul class="alerts">${al.map(a=>`<li style="cursor:default"><span class="pill lv-${a.lvl}">${{alto:'crítico',medio:'atenção',info:'info'}[a.lvl]}</span><span>${esc(a.msg)}</span></li>`).join('')}</ul></div>`;
  h+=`<div class="subtabs">${SUBS.map(([k,t])=>`<button class="${ui.sub===k?'on':''}" onclick="ui.sub='${k}';render()">${t}</button>`).join('')}</div>`;
  const parts={geral:()=>pGeral(p,P),itens:()=>pItens(p,P,T),etapas:()=>pEtapas(p,P,T),docs:()=>pDocs(p,P),cambio:()=>pCambio(p,P,T),hist:()=>pHist(p)};
  if(ui.sub==='all')h+=SUBS.map(([k,t])=>`<h2 class="ptitle">${t}</h2>`+parts[k]()).join('');
  else h+=(parts[ui.sub]||parts.geral)();
  return h;}

function pGeral(p,P){
  const fo=[['','— selecione —'],...db.fornecedores.map(f=>[f.id,f.nome||'(sem nome)'])];
  const ag=tipo=>[['','— selecione —'],...db.agentes.filter(a=>!tipo||a.tipo===tipo).map(a=>[a.id,a.nome||'(sem nome)'])];
  return `<div class="card"><h3 style="margin-top:0">Identificação</h3><div class="form">
    ${fld('Nº do processo',inp(P+'.numero',p.numero))}
    ${fld('Referência interna',inp(P+'.ref',p.ref,{ph:'ex.: projeto, centro de custo'}))}
    ${fld('Fornecedor (exportador)',sel(P+'.fornecedorId',p.fornecedorId,fo))}
    ${fld('País de origem',inp(P+'.pais',p.pais,{list:'dl-pais'}))}
    ${fld('Pedido de compra (PO)',inp(P+'.po',p.po))}
    ${fld('Proforma / Invoice nº',inp(P+'.invoice',p.invoice))}
    ${fld('Incoterm',sel(P+'.incoterm',p.incoterm,[['','—'],...optsArr(INCOTERMS)]))}
    ${fld('Moeda',sel(P+'.moeda',p.moeda,optsArr(MOEDAS)))}
    ${fld('Taxa de câmbio (DUIMP/DI)',inp(P+'.taxa',p.taxa,{type:'num',ph:'ex.: 5,4321'}))}
  </div></div>
  <div class="card"><h3 style="margin-top:0">Logística</h3><div class="form">
    ${fld('Modal',sel(P+'.modal',p.modal,optsObj(MODAIS)))}
    ${fld('Agente de carga',sel(P+'.agenteId',p.agenteId,ag('Agente de carga')))}
    ${fld('Conhecimento (BL / AWB / CRT)',inp(P+'.conhecimento',p.conhecimento))}
    ${fld('Navio / voo / veículo',inp(P+'.veiculo',p.veiculo))}
    ${fld('Container(s)',inp(P+'.containers',p.containers,{ph:'ex.: 1x40HC MSCU1234567'}))}
    ${fld('Origem (porto/aeroporto)',inp(P+'.origem',p.origem))}
    ${fld('Destino (porto/aeroporto)',inp(P+'.destino',p.destino))}
    ${fld('Recinto alfandegado',inp(P+'.recinto',p.recinto))}
    ${fld('ETD previsto',inp(P+'.etd',p.etd,{type:'date'}))}
    ${fld('ETA previsto',inp(P+'.eta',p.eta,{type:'date'}))}
    ${fld('Free time (dias)',inp(P+'.freeTime',p.freeTime,{type:'num',ph:String(db.config.freeTime)}))}
    ${fld('Peso bruto (kg)',inp(P+'.pesoBruto',p.pesoBruto,{type:'num'}))}
  </div></div>
  <div class="card"><h3 style="margin-top:0">Desembaraço</h3><div class="form">
    ${fld('Despachante',sel(P+'.despachanteId',p.despachanteId,ag('Despachante')))}
    ${fld('DUIMP / DI nº',inp(P+'.duimp',p.duimp))}
    ${fld('Canal de parametrização',sel(P+'.canal',p.canal,optsObj(CANAIS)))}
    ${fld('NF de entrada nº',inp(P+'.nf',p.nf))}
    ${fld('Observações',ta(P+'.obs',p.obs),'wide')}
  </div></div>`;}

function pItens(p,P,T){
  const m=p.moeda||'',cu=p.custos;
  const rows=p.itens.map((it,i)=>{const Q=P+'.itens.'+i;return `<tr>
    <td>${inp(Q+'.cod',it.cod,{cls:'w-m'})}</td><td>${inp(Q+'.desc',it.desc,{cls:'w-l'})}</td>
    <td>${inp(Q+'.ncm',it.ncm,{list:'dl-ncm',cls:'w-m'})}</td>
    <td>${inp(Q+'.qtd',it.qtd,{type:'num',cls:'w-s'})}</td><td>${inp(Q+'.un',it.un,{list:'dl-un',cls:'w-s'})}</td>
    <td>${inp(Q+'.vu',it.vu,{type:'num',cls:'w-m'})}</td><td class="r">${NF2.format(n(it.qtd)*n(it.vu))}</td>
    ${['ii','ipi','pis','cofins','icms'].map(k=>`<td>${inp(Q+'.'+k,it[k],{type:'num',cls:'w-s'})}</td>`).join('')}
    <td><button class="mini danger" onclick="delItem('${P}.itens',${i})" title="remover">✕</button></td></tr>`;}).join('');
  const r=(l,v,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="r">${v}</td></tr>`;
  const desp=(l,k,o={})=>fld(l,inp(P+'.custos.'+k,cu[k],Object.assign({type:'num'},o)));
  return `<div class="card"><h3 style="margin-top:0">Itens da invoice</h3>

function pEtapas(p,P,T){

  const dur=(a,b,l)=>`<tr><td>${l}</td><td class="r">${e[a]&&e[b]?diasEntre(e[a],e[b])+' dias':'—'}</td></tr>`;
  return `<div class="sum"><div class="card"><h3 style="margin-top:0">Datas realizadas</h3><table>${STAGES.map(s=>`<tr><td>${s.t}</td><td style="width:170px">${inp(P+'.etapas.'+s.k,e[s.k],{type:'date'})}</td></tr>`).join('')}</table>
    <p class="note">Preencha a data quando a etapa acontecer — o status do processo avança automaticamente.</p></div>
  <div><div class="card"><h3 style="margin-top:0">Previsto × realizado</h3><table>
    <tr><td>Embarque</td><td class="r">prev. ${fd(p.etd)} · real ${fd(e.embarque)}${p.etd&&e.embarque?` (${diasEntre(p.etd,e.embarque)>0?'+':''}${diasEntre(p.etd,e.embarque)} d)`:''}</td></tr>
    <tr><td>Chegada</td><td class="r">prev. ${fd(p.eta)} · real ${fd(e.chegada)}${p.eta&&e.chegada?` (${diasEntre(p.eta,e.chegada)>0?'+':''}${diasEntre(p.eta,e.chegada)} d)`:''}</td></tr></table></div>
  <div class="card"><h3 style="margin-top:0">Tempos</h3><table>
    ${dur('pedido','embarque','Pedido → embarque')}${dur('embarque','chegada','Trânsito internacional')}${dur('chegada','registro','Chegada → registro')}
    ${dur('registro','desembaraco','Registro → desembaraço')}${dur('desembaraco','entrega','Desembaraço → entrega')}${dur('pedido','entrega','Lead time total')}</table></div>
  <div class="card"><h3 style="margin-top:0">Free time</h3>${lim?`<p>Chegada ${fd(e.chegada)} + ${ft} dias = vence em <b>${fd(lim)}</b> ${e.entrega?'<span class="pill lv-ok">carga retirada</span>':(()=>{const d=diasAte(lim);return d<0?`<span class="pill lv-alto">estourado há ${-d} d</span>`:`<span class="pill ${d<=3?'lv-medio':'lv-ok'}">${d} dia(s) restantes</span>`;})()}</p>`:'<p class="note">Será calculado a partir da data de chegada.</p>'}</div></div></div>`;}

function pDocs(p,P){

  ${DOCS.map(d=>{const v=p.docs[d.k]||{},need=d.req&&si>=stageIndex(d.req);return `<tr><td>${d.t}</td><td>${d.req?STAGES[stageIndex(d.req)].t:'<span class="note">quando aplicável</span>'}</td>

  <td>${v.ok?'<span class="pill lv-ok">ok</span>':need?'<span class="pill lv-alto">pendente</span>':'<span class="note">—</span>'}</td></tr>`;}).join('')}

function pCambio(p,P,T){
  const m=p.moeda||'';let tot=0,pago=0,brlTot=0,varc=0;
  const rows=p.pagamentos.map((pg,i)=>{const Q=P+'.pagamentos.'+i,v=n(pg.valor),tx=n(pg.taxa)||T.tx;tot+=v;if(pg.pago)pago+=v;brlTot+=v*tx;
    const vc=n(pg.taxa)&&T.tx?v*(T.tx-n(pg.taxa)):0;varc+=vc;
    const st=pg.pago?'<span class="pill lv-ok">pago</span>':pg.venc?(diasAte(pg.venc)<0?'<span class="pill lv-alto">vencido</span>':'<span class="pill lv-info">a vencer</span>'):'';
    return `<tr><td>${sel(Q+'.tipo',pg.tipo,optsArr(TIPOS_PG))}</td><td>${inp(Q+'.valor',pg.valor,{type:'num',cls:'w-m'})}</td><td>${inp(Q+'.venc',pg.venc,{type:'date'})}</td><td>${inp(Q+'.pago',pg.pago,{type:'date'})}</td>
    <td>${inp(Q+'.taxa',pg.taxa,{type:'num',cls:'w-m'})}</td><td>${inp(Q+'.contrato',pg.contrato,{cls:'w-m'})}</td><td>${inp(Q+'.banco',pg.banco,{cls:'w-m'})}</td>
    <td class="r">${brl(v*tx)}</td><td>${st}</td><td><button class="mini danger" onclick="delItem('${P}.pagamentos',${i})">✕</button></td></tr>`;}).join('');
  const base=T.fob+n(p.custos.frete)*(p.pagamentos.some(x=>x.tipo==='Frete internacional')?1:0);
  return `<div class="card"><h3 style="margin-top:0">Pagamentos ao exterior / contratos de câmbio</h3>
  <div class="tw"><table class="grid"><thead><tr><th>Tipo</th><th>Valor (${esc(m)})</th><th>Vencimento</th><th>Pago em</th><th>Taxa contratada</th><th>Contrato câmbio</th><th>Banco</th><th class="r">Valor R$</th><th>Situação</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="10" class="empty">Nenhum pagamento programado.</td></tr>'}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button onclick="addPg('${P}.pagamentos')">+ pagamento</button></div></div>
  <div class="sum"><div class="card"><table>
    <tr><td>Valor a pagar (itens${base>T.fob?' + frete':''})</td><td class="r">${mo(base,m)}</td></tr>
    <tr><td>Programado</td><td class="r">${mo(tot,m)}</td></tr><tr><td>Pago</td><td class="r">${mo(pago,m)}</td></tr>
    <tr class="tot"><td>Saldo sem programação</td><td class="r">${mo(base-tot,m)}</td></tr></table></div>
  <div class="card"><table><tr><td>Total em R$ (taxas contratadas)</td><td class="r">${brl(brlTot)}</td></tr>
    <tr><td>Variação cambial vs. taxa da DUIMP/DI</td><td class="r">${T.tx?brl(varc):'—'}</td></tr></table>
    <p class="note">Variação positiva = ganho (taxa contratada menor que a da DUIMP/DI).</p></div></div>`;}

function pHist(p){

  ${F.map(({p,pg})=>{const d=pg.venc?diasAte(pg.venc):null;const st=pg.pago?'<span class="pill lv-ok">pago</span>':d==null?'':d<0?`<span class="pill lv-alto">vencido ${-d} d</span>`:d<=7?`<span class="pill lv-medio">${d} d</span>`:`<span class="pill lv-info">${d} d</span>`;

  </tbody></table></div>`;}

// ----- Relatórios -----
function vRel(){
  const P=db.processos.filter(p=>!p.cancelado);
  const fornAgg={};P.forEach(p=>{const k=p.fornecedorId||'';const T=calc(p);const a=fornAgg[k]||(fornAgg[k]={n:0,fob:0,total:0,trib:0,lead:[],atraso:[]});
    a.n++;a.fob+=T.fobBRL;a.total+=T.total;a.trib+=T.trib;if(p.etapas.pedido&&p.etapas.entrega)a.lead.push(diasEntre(p.etapas.pedido,p.etapas.entrega));if(p.eta&&p.etapas.chegada)a.atraso.push(diasEntre(p.eta,p.etapas.chegada));});
  const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(0):'—';
  const ncmAgg={};P.forEach(p=>calc(p).itens.forEach(x=>{const k=x.it.ncm||'(sem NCM)';const a=ncmAgg[k]||(ncmAgg[k]={n:0,va:0,trib:0,total:0});a.n++;a.va+=x.vai;a.trib+=x.trib;a.total+=x.total;}));
  const modAgg={};P.forEach(p=>{const e=p.etapas;if(!(e.embarque&&e.chegada))return;const a=modAgg[p.modal]||(modAgg[p.modal]={t:[],ad:[]});a.t.push(diasEntre(e.embarque,e.chegada));if(e.chegada&&e.desembaraco)a.ad.push(diasEntre(e.chegada,e.desembaraco));});
  const canAgg={};P.forEach(p=>{if(p.canal)canAgg[p.canal]=(canAgg[p.canal]||0)+1;});
  return `<div class="card"><div class="row"><h3 style="margin:0">Por fornecedor</h3><button class="right mini" onclick="csvFornecedores()">⤓ CSV</button></div><div class="tw" style="margin-top:8px"><table><thead><tr><th>Fornecedor</th><th class="r">Processos</th><th class="r">Mercadoria (R$)</th><th class="r">Tributos</th><th class="r">Custo total</th><th class="r">Fator</th><th class="r">Lead time médio</th><th class="r">Atraso médio ETA</th></tr></thead><tbody>
  ${Object.entries(fornAgg).map(([k,a])=>`<tr><td>${esc((forn(k)||{}).nome||'(não informado)')}</td><td class="r">${a.n}</td><td class="r">${brl(a.fob)}</td><td class="r">${brl(a.trib)}</td><td class="r">${brl(a.total)}</td><td class="r">${a.fob?NF2.format(a.total/a.fob)+'×':'—'}</td><td class="r">${avg(a.lead)} d</td><td class="r">${avg(a.atraso)} d</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sem dados.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3 style="margin-top:0">Por NCM</h3><div class="tw"><table><thead><tr><th>NCM</th><th>Descrição</th><th class="r">Itens</th><th class="r">Valor aduaneiro</th><th class="r">Tributos</th><th class="r">Carga tributária</th><th class="r">Custo total</th></tr></thead><tbody>
  ${Object.entries(ncmAgg).sort((a,b)=>b[1].total-a[1].total).map(([k,a])=>`<tr><td>${esc(k)}</td><td>${esc((db.ncms.find(x=>x.codigo===k)||{}).descricao||'')}</td><td class="r">${a.n}</td><td class="r">${brl(a.va)}</td><td class="r">${brl(a.trib)}</td><td class="r">${a.va?pct(a.trib/a.va*100):'—'}</td><td class="r">${brl(a.total)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem dados.</td></tr>'}</tbody></table></div></div>
  <div class="sum"><div class="card"><h3 style="margin-top:0">Tempos por modal</h3><table><thead><tr><th>Modal</th><th class="r">Trânsito médio</th><th class="r">Chegada → desembaraço</th></tr></thead><tbody>
  ${Object.entries(modAgg).map(([k,a])=>`<tr><td>${MODAIS[k]||k}</td><td class="r">${avg(a.t)} d</td><td class="r">${avg(a.ad)} d</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados.</td></tr>'}</tbody></table></div>
  <div class="card"><h3 style="margin-top:0">Canais de parametrização</h3><table><tbody>${Object.entries(CANAIS).filter(([k])=>k).map(([k,t])=>`<tr><td>${canalPill(k)}</td><td class="r">${canAgg[k]||0}</td></tr>`).join('')}</tbody></table></div></div>`;}

  if(ui.cad==='config'){const c='config';h+=`<div class="card"><div class="form">
    ${fld('AFRMM (% sobre frete marítimo)',inp(c+'.afrmm',db.config.afrmm,{type:'num'}))}
    ${fld('Taxa Siscomex padrão (R$)',inp(c+'.siscomex',db.config.siscomex,{type:'num'}))}
    ${fld('ICMS padrão (%)',inp(c+'.icms',db.config.icms,{type:'num'}))}
    ${fld('Free time padrão (dias)',inp(c+'.freeTime',db.config.freeTime,{type:'num'}))}
    ${fld('Alertar chegada com antecedência de (dias)',inp(c+'.alertaEta',db.config.alertaEta,{type:'num'}))}
    ${fld('Capatazia compõe o valor aduaneiro',`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)">${chk(c+'.capatazNoVA',db.config.capatazNoVA)} sim</label>`)}
  </div></div>
  <div class="card"><h3 style="margin-top:0">Dados</h3><p class="note">Os dados ficam salvos neste navegador. Use <b>backup</b> regularmente para guardar uma cópia ou levar para outro computador.</p>
  <div class="row"><button onclick="exportJSON()">⤓ baixar backup</button><button onclick="seed()">carregar dados de exemplo</button><button class="danger" onclick="limpar()">apagar todos os dados</button></div></div>`;}
  return h;}

// ===================== Ações =====================
function log(p,t){p.log.push({d:agora(),t});}
window.novoProc=()=>{
  db.seq=(db.seq||0)+1;
  const p={id:uid(),numero:`IMP-${hoje().slice(0,4)}-${String(db.seq).padStart(3,'0')}`,criado:hoje(),moeda:'USD',modal:'maritimo',incoterm:'FOB',
    itens:[],custos:{},etapas:{},docs:{},pagamentos:[],log:[]};
  log(p,'Processo criado');db.processos.unshift(p);save();ui.sub='geral';abrir(p.id);};
window.duplicar=id=>{const o=db.processos.find(x=>x.id===id);const p=JSON.parse(JSON.stringify(o));db.seq++;
  Object.assign(p,{id:uid(),numero:`IMP-${hoje().slice(0,4)}-${String(db.seq).padStart(3,'0')}`,criado:hoje(),etapas:{},docs:{},log:[],cancelado:false,
    duimp:'',canal:'',nf:'',conhecimento:'',veiculo:'',containers:'',etd:'',eta:'',invoice:'',taxa:null});
  p.itens.forEach(i=>i.id=uid());p.pagamentos=p.pagamentos.map(x=>({id:uid(),tipo:x.tipo,valor:x.valor}));
  log(p,'Processo criado a partir de '+o.numero);db.processos.unshift(p);save();ui.sub='geral';abrir(p.id);};
window.cancelar=id=>{const p=db.processos.find(x=>x.id===id);p.cancelado=!p.cancelado;log(p,p.cancelado?'Processo cancelado':'Processo reativado');save();render();};
window.excluir=id=>{const p=db.processos.find(x=>x.id===id);if(!confirm(`Excluir definitivamente o processo ${p.numero}?`))return;db.processos=db.processos.filter(x=>x.id!==id);save();go('processos');};
window.addItem=path=>{getPath(path).push({id:uid(),qtd:1,un:'UN',icms:db.config.icms});save();render();};
window.addPg=path=>{getPath(path).push({id:uid(),tipo:'Antecipado'});save();render();};
window.delItem=(path,i)=>{if(!confirm('Remover esta linha?'))return;getPath(path).splice(i,1);save();render();};
window.addCad=key=>{db[key].push({id:uid()});save();render();};
window.delCad=(key,i)=>{const r=db[key][i];
  const uso=key==='fornecedores'?db.processos.filter(p=>p.fornecedorId===r.id).length:key==='agentes'?db.processos.filter(p=>p.despachanteId===r.id||p.agenteId===r.id).length:0;
  if(!confirm(uso?`Este cadastro é usado em ${uso} processo(s). Remover mesmo assim?`:'Remover este cadastro?'))return;db[key].splice(i,1);save();render();};
window.addNote=id=>{const el=document.getElementById('newNote');const t=(el.value||'').trim();if(!t)return;log(db.processos.find(x=>x.id===id),t);save();render();};
window.imprimir=()=>{const s=ui.sub;ui.sub='all';render();setTimeout(()=>{window.print();ui.sub=s;render();},50);};
window.limpar=()=>{if(!confirm('Apagar TODOS os dados deste navegador? Recomendamos baixar um backup antes.'))return;if(prompt('Digite APAGAR para confirmar')!=='APAGAR')return;db=blank();save();go('painel');};

// efeitos colaterais de edições
function hooks(path,v,old){
  let m;
  if((m=path.match(/^processos\.(\d+)\.etapas\.(\w+)$/))){const p=db.processos[+m[1]],s=STAGES[stageIndex(m[2])];
    if(v&&v!==old)log(p,`Etapa "${s.t}" registrada em ${fd(v)}`);else if(!v&&old)log(p,`Data da etapa "${s.t}" removida`);}
  if((m=path.match(/^processos\.(\d+)\.canal$/))&&v)log(db.processos[+m[1]],`Canal de parametrização: ${CANAIS[v]}`);
  if((m=path.match(/^processos\.(\d+)\.itens\.(\d+)\.ncm$/))){const it=db.processos[+m[1]].itens[+m[2]];const nc=db.ncms.find(x=>x.codigo===String(v).trim());
    if(nc)['ii','ipi','pis','cofins','icms'].forEach(k=>{if(nc[k]!=null&&nc[k]!=='')it[k]=nc[k];});}
  if((m=path.match(/^processos\.(\d+)\.fornecedorId$/))){const p=db.processos[+m[1]],f=forn(v);if(f){if(f.moeda)p.moeda=f.moeda;if(f.incoterm)p.incoterm=f.incoterm;if(f.pais&&!p.pais)p.pais=f.pais;}}
  if((m=path.match(/^processos\.(\d+)\.docs\.(\w+)\.ok$/))&&v){const d=DOCS.find(x=>x.k===m[2]);log(db.processos[+m[1]],`Documento recebido: ${d.t}`);}
  if((m=path.match(/^processos\.(\d+)\.pagamentos\.(\d+)\.pago$/))&&v){const p=db.processos[+m[1]],pg=p.pagamentos[+m[2]];log(p,`Pagamento ${(pg.tipo||'').toLowerCase()} de ${mo(pg.valor,p.moeda)} liquidado em ${fd(v)}`);}
}
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.b)return;
  const path=el.dataset.b,t=el.dataset.t;
  const v=t==='num'?(el.value===''?null:Number(el.value)):t==='bool'?el.checked:el.value;
  const old=getPath(path);setPath(path,v);hooks(path,v,old);save();
  setTimeout(()=>{const a=document.activeElement,key=a&&a.dataset&&a.dataset.b;const y=window.scrollY;render();window.scrollTo(0,y);
    if(key){const nx=document.querySelector(`[data-b="${CSS.escape(key)}"]`);if(nx)nx.focus({preventScroll:true});}},0);});

// ===================== Import / export =====================
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
window.exportJSON=()=>download(`importacao_backup_${hoje()}.json`,JSON.stringify(db,null,1),'application/json');
window.importJSON=inpEl=>{const f=inpEl.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.processos))throw new Error('arquivo não é um backup deste sistema');
  if(!confirm(`Restaurar backup com ${d.processos.length} processo(s)? Os dados atuais serão substituídos.`))return;db=migrate(d);save();go('painel');}catch(err){alert('Não foi possível ler o backup: '+err.message);}finally{inpEl.value='';}};r.readAsText(f);};
const cnum=v=>v==null||v===''?'':String(Math.round(v*100)/100).replace('.',',');
function csv(name,head,rows){const q=x=>{const s=String(x??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  download(name,'﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
window.csvProcessos=()=>csv(`processos_${hoje()}.csv`,['Processo','Referência','Fornecedor','País','PO','Invoice','Incoterm','Modal','Moeda','Taxa','Conhecimento','ETD','ETA','Status','Canal','DUIMP/DI',...STAGES.map(s=>s.t),'Valor itens (moeda)','Valor aduaneiro (R$)','II','IPI','PIS','COFINS','ICMS','Siscomex','AFRMM','Despesas','Custo total (R$)','Custo líquido (R$)'],
  filtrados().map(p=>{const T=calc(p);return [p.numero,p.ref,(forn(p.fornecedorId)||{}).nome,p.pais,p.po,p.invoice,p.incoterm,MODAIS[p.modal],p.moeda,cnum(p.taxa),p.conhecimento,fd(p.etd),fd(p.eta),statusTxt(p),CANAIS[p.canal||''],p.duimp,...STAGES.map(s=>p.etapas[s.k]?fd(p.etapas[s.k]):''),cnum(T.fob),cnum(T.va),cnum(T.ii),cnum(T.ipi),cnum(T.pis),cnum(T.cofins),cnum(T.icms),cnum(T.siscomex),cnum(T.afrmm),cnum(T.outras),cnum(T.total),cnum(T.liq)];}));
window.csvPagamentos=()=>{const R=[];db.processos.forEach(p=>p.pagamentos.forEach(pg=>R.push([p.numero,(forn(p.fornecedorId)||{}).nome,pg.tipo,p.moeda,cnum(pg.valor),fd(pg.venc),fd(pg.pago),cnum(pg.taxa),pg.contrato,pg.banco])));
  csv(`pagamentos_${hoje()}.csv`,['Processo','Fornecedor','Tipo','Moeda','Valor','Vencimento','Pago em','Taxa','Contrato','Banco'],R);};
window.csvFornecedores=()=>{const R=db.fornecedores.map(f=>{const L=db.processos.filter(p=>!p.cancelado&&p.fornecedorId===f.id);const t=L.reduce((s,p)=>s+calc(p).total,0);return [f.nome,f.pais,L.length,cnum(t)];});
  csv(`fornecedores_${hoje()}.csv`,['Fornecedor','País','Processos','Custo total (R$)'],R);};
