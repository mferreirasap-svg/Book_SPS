<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Importação — SPS</title>
<style>
:root{
  --navy:#0A0A5E; --navy2:#2A2A8C; --coral:#B0432A; --coralbg:#FBEDE8;
  --teal:#0A7A70; --tealbg:#E0F5F2; --blue:#0098C8; --bluebg:#E2F2FA;
  --amber:#9A6200; --amberbg:#FCF1DC;
  --ink:#1c1c2e; --muted:#5F5E6A; --line:#E3E1E8; --bg:#F6F6FA; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14.5px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.brandbar{height:5px;background:linear-gradient(90deg,#00B0A6 0%,#0098C8 45%,#0A0A5E 100%);border-radius:3px;margin-bottom:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:12px}
.htitle{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:40px}
h1{font-size:19px;margin:0;color:var(--navy)}
h2{font-size:16px;color:var(--navy);margin:22px 0 10px}
h3{font-size:14px;color:var(--navy2);margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto}
button,.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.12s;display:inline-block;line-height:1.3;white-space:nowrap}
button:hover,.btn:hover{background:#f0eef6;border-color:#cbc9d6}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{filter:brightness(1.15)}
button.danger{color:var(--coral)}
button.mini{font-size:12px;padding:3px 8px}
button:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
nav button{border-radius:20px;padding:7px 15px;font-weight:500;color:var(--navy2)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:650;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.warn .v{color:var(--coral)}
.kpi.custom{border-style:dashed}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pipe div{border-radius:10px;padding:10px 12px;cursor:pointer;border:1px solid transparent}
.pipe div:hover{border-color:var(--line)}
.pipe b{display:block;font-size:20px}
.pipe span{font-size:12px}
.g-prep{background:var(--bluebg);color:#04608a}
.g-transito{background:#E8E6F8;color:var(--navy2)}
.g-aduana{background:var(--amberbg);color:var(--amber)}
.g-liberado{background:var(--tealbg);color:var(--teal)}
.g-encerrado{background:#e6e6ea;color:#3c3c48}
.g-cancelado{background:var(--coralbg);color:var(--coral)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.c-verde{background:#DDF3E4;color:#1d7a3e}.c-amarelo{background:#FFF3C4;color:#8a6a00}.c-vermelho{background:var(--coralbg);color:var(--coral)}.c-cinza{background:#e4e4e8;color:#444}
.c-azul{background:var(--bluebg);color:#04608a}.c-roxo{background:#ECE6FA;color:#5B3BA8}
.lv-alto{background:var(--coralbg);color:var(--coral)}.lv-medio{background:var(--amberbg);color:var(--amber)}.lv-info{background:var(--bluebg);color:#04608a}.lv-ok{background:var(--tealbg);color:var(--teal)}
.sem{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:4px}
.sem-vermelho{background:#C8402A}.sem-amarelo{background:#E3A400}.sem-verde{background:#1d9a50}
tr.r-vermelho td{background:#FDF1ED}tr.r-amarelo td{background:#FFF9E6}tr.r-verde td{background:#F1FAF4}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid #f0eef6;cursor:pointer;flex-wrap:wrap}
.alerts li:hover{background:#faf9fd}
.alerts .pn{font-weight:600;color:var(--navy);min-width:110px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f4f3fb;color:var(--navy2);font-weight:600;text-align:left;padding:8px 9px;white-space:nowrap;font-size:12px}
td{padding:6px 9px;border-top:1px solid #f0eef6;vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#faf9fd}
tfoot td{font-weight:650;background:#fafafd}
td.empty{text-align:center;color:var(--muted);padding:18px}
.grid td{padding:4px 5px}
.grid input,.grid select{min-width:70px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d9f0;border-color:var(--blue)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);padding:0}
input.w-xs{min-width:52px;width:58px}input.w-s{min-width:64px;width:74px}input.w-m{min-width:110px}input.w-l{min-width:190px}
select.w-m{min-width:120px}
textarea{min-height:70px;resize:vertical}
textarea.sn{min-height:34px;min-width:150px;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld.wide{grid-column:1/-1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input,.filters select{width:auto;min-width:150px;flex:1 1 150px;max-width:420px}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.phead h2{margin:0;font-size:20px}
.phead .meta{color:var(--muted);font-size:13px}
.steps{display:flex;gap:0;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px}
.step{flex:1 0 96px;text-align:center;position:relative;font-size:11.5px;color:var(--muted);padding:0 4px}
.step:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.step:first-child:before{display:none}
.step .dot{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 4px;position:relative;z-index:1;font-size:12px;line-height:18px;font-weight:700;color:#fff}
.step.done .dot{background:var(--teal);border-color:var(--teal)}
.step.done:before,.step.cur:before{background:var(--teal)}
.step.cur .dot{background:var(--navy);border-color:var(--navy)}
.step.done,.step.cur{color:var(--ink)}
.step .dt{display:block;color:var(--muted);font-size:11px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.subtabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:500;padding:8px 12px}
.subtabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.sum table td{border-top:1px solid #f0eef6}
.sum tr.tot td{font-weight:700;color:var(--navy);border-top:2px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px solid #f0eef6;font-size:13px}
.log .d{color:var(--muted);font-size:12px;margin-right:8px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state button{margin-top:10px}
.toast{background:var(--tealbg);border:1px solid #a8ddd4;color:#075a53;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast a{color:var(--navy);font-weight:600}
.kan{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.kcol{flex:0 0 250px;background:#eceaf4;border-radius:10px;padding:8px;min-height:140px}
.kcol.over{outline:2px dashed var(--blue)}
.kcol h4{margin:2px 4px 8px;font-size:13px;color:var(--navy2);display:flex;justify-content:space-between}
.kcard{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;border-left:4px solid #ccc;cursor:pointer;font-size:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kcard.k-vermelho{border-left-color:#C8402A}.kcard.k-amarelo{border-left-color:#E3A400}.kcard.k-verde{border-left-color:#1d9a50}
.kcard b{color:var(--navy)}
.kcard .m{color:var(--muted);font-size:11.5px}
.attrs{display:flex;gap:4px;flex-wrap:wrap}
.attrs input{width:96px;min-width:80px;font-size:12px;padding:4px 6px}
.condcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fcfcfe}
.chips label{display:inline-flex;gap:6px;align-items:center;margin:2px 10px 2px 0;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
@media print{
  nav,.toolbar,.subtabs,.noprint,button,.toast{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card,.tw{border:none;padding:0}
  input,select,textarea{border:none;padding:0;background:transparent}
}

// ===================== Alertas (prioridade + cores) =====================
const LVORD={alto:0,medio:1,info:2};
const LVTXT={alto:'crítico',medio:'atenção',info:'info'};
function alertasProc(p){
  const A=[],c=db.config;if(!ativo(p))return A;
  const e=p.etapas,si=stageIdx(p),add=(lvl,msg)=>A.push({lvl,msg,o:p,tipo:'proc'});
  if(!e.chegada&&p.eta){const d=diasAte(p.eta);
    if(d<0)add('alto',`ETA vencido há ${-d} dia(s) sem registro de chegada`);
    else if(d<=n(c.alertaEta))add('medio',`Chegada prevista em ${d} dia(s) (${fd(p.eta)})`);}
  if(p.modal==='maritimo'){const dm=demurInfo(p);if(dm.ini&&!p.devolucao){const d=diasAte(dm.lim);
    if(d<0)add('alto',`Free time estourado há ${-d} dia(s) — demurrage estimado ${brl(C(p).demur)}`);
    else if(d<=3)add('medio',`Free time vence em ${d} dia(s) (${fd(dm.lim)}) — programar devolução do container`);}}
  if(!e.desembaraco&&(p.canal==='vermelho'||p.canal==='cinza'))add('alto',`Canal ${CANAIS[p.canal].toLowerCase()} — acompanhar conferência e lançar custos extras`);
  if(!e.desembaraco&&p.canal==='amarelo')add('medio','Canal amarelo — conferência documental');
  const pend=DOCS.filter(d=>d.req&&si>=stageIndex(d.req)&&!(p.docs[d.k]&&p.docs[d.k].ok));
  if(pend.length)add('medio','Documentos pendentes: '+pend.map(d=>d.t).join(', '));
  const T=C(p);
  if(!e.desembaraco&&(e.chegada||(p.eta&&diasAte(p.eta)<=5))&&T.numEnv<T.numSug*0.95)add('medio',`Numerário: enviado ${brl(T.numEnv)} de ${brl(T.numSug)} sugerido`);
  p.despesas.forEach(d=>{if(d.status!=='paga'&&d.venc&&diasAte(d.venc)<0)add('alto',`Despesa "${d.nome||(despTipo(d.tipoId)||{}).nome}" vencida em ${fd(d.venc)}`);});
  if(si>=stageIndex('desembaraco')){const sn=procItens(p).filter(x=>x.serial&&(x.pi.series||'').split(/\n/).map(s=>s.trim()).filter(Boolean).length!==x.q);
    if(sn.length)add('medio',`Números de série incompletos em ${sn.length} item(ns)`);}
  if(si>=stageIndex('registro')&&p.moeda!=='BRL'&&!n(p.taxa))add('info','Informe a taxa de câmbio da DUIMP/DI para fechar os custos');
  if(n(p.valorDI)&&T.fob&&Math.abs(n(p.valorDI)-T.fob)/T.fob>0.005)add('medio',`Divergência CI × DUIMP/DI: ${mo(T.fob,p.moeda)} × ${mo(p.valorDI,p.moeda)}`);
  if(T.pi&&Math.abs(T.fob-T.pi)/T.pi>0.005)add('info',`Valor da invoice difere da proforma: ${mo(T.fob,p.moeda)} × ${mo(T.pi,p.moeda)}`);
  if(!p.itens.length)add('info','Embarque sem itens vinculados');
  return A;}
function alertasPed(pe){
  const A=[],c=db.config;if(!pedAtivo(pe))return A;const add=(lvl,msg)=>A.push({lvl,msg,o:pe,tipo:'ped'});
  let atras=0,prox=0,parado=0;
  pe.itens.forEach(it=>{const st=prodStatus(it);if(st==='embarcado')return;
    if(st==='producao'||(st==='alocado'&&!it.prontoReal)){const pp=prontoPrev(pe,it);if(!pp)return;const d=diasAte(pp);if(d<0)atras++;else if(d<=n(c.alertaPronto))prox++;}
    if(st==='pronto'&&it.prontoReal&&diasAte(it.prontoReal)<-15&&qtdInfo(it).saldo>0)parado++;});
  if(atras)add('alto',`${atras} item(ns) com produção atrasada`);
  if(prox)add('medio',`${prox} item(ns) ficam prontos em até ${c.alertaPronto} dias — programar saldo e embarque`);
  if(parado)add('medio',`${parado} item(ns) prontos há mais de 15 dias sem embarque`);
  pe.parcelas.forEach(pa=>{if(pa.pago)return;const v=vencParcela(pe,pa);if(!v.d)return;const d=diasAte(v.d);
    if(d<0)add('alto',`Parcela "${pa.desc||EVENTOS[pa.evento]}" de ${mo(valorParcela(pe,pa),pe.moeda)} vencida há ${-d} dia(s)`);
    else if(d<=7)add('medio',`Parcela "${pa.desc||EVENTOS[pa.evento]}" de ${mo(valorParcela(pe,pa),pe.moeda)} vence em ${d} dia(s)`);});
  return A;}

function semaforo(A){return A.some(a=>a.lvl==='alto')?'vermelho':A.some(a=>a.lvl==='medio')?'amarelo':'verde';}

const KPI_M={qtd:'Nº de embarques',va:'Valor aduaneiro (R$)',total:'Custo total (R$)',trib:'Tributos (R$)',lead:'Lead time pedido → entrega (dias)',transito:'Trânsito internacional (dias)',
  aduana:'Chegada → desembaraço (dias)',verde:'% canal verde',fator:'Fator de nacionalização',atraso:'Atraso vs ETA (dias)',demurrage:'Demurrage estimado (R$)'};
function kpiCalc(k){
  let P=db.processos.filter(p=>!p.cancelado);
  if(k.grp==='ativos')P=P.filter(ativo);else if(k.grp)P=P.filter(p=>grp(p)===k.grp);
  if(k.modal)P=P.filter(p=>p.modal===k.modal);if(k.filialId)P=P.filter(p=>p.filialId===k.filialId);if(k.fornecedorId)P=P.filter(p=>p.fornecedorId===k.fornecedorId);
  if(n(k.dias))P=P.filter(p=>p.criado&&diasAte(p.criado)>=-n(k.dias));
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
  const dt=(a,b)=>P.filter(p=>p.etapas[a]&&p.etapas[b]).map(p=>diasEntre(p.etapas[a],p.etapas[b]));
  const r={qtd:()=>P.length,va:()=>sum(P,p=>C(p).va),total:()=>sum(P,p=>C(p).total),trib:()=>sum(P,p=>C(p).trib),
    lead:()=>avg(P.filter(p=>p.etapas.entrega).map(p=>{const d=pedDataProc(p);return d?diasEntre(d,p.etapas.entrega):null;}).filter(x=>x!=null)),
    transito:()=>avg(dt('embarque','chegada')),aduana:()=>avg(dt('chegada','desembaraco')),
    verde:()=>{const L=P.filter(p=>p.canal);return L.length?L.filter(p=>p.canal==='verde').length/L.length*100:null;},
    fator:()=>avg(P.filter(p=>C(p).fator).map(p=>C(p).fator)),atraso:()=>avg(P.filter(p=>p.eta&&p.etapas.chegada).map(p=>diasEntre(p.eta,p.etapas.chegada))),
    demurrage:()=>sum(P,p=>C(p).demur)}[k.metrica];
  const v=r?r():null;if(v==null)return '—';
  if(['va','total','trib','demurrage'].includes(k.metrica))return brl(v);if(k.metrica==='verde')return pct(v);if(k.metrica==='fator')return NF2.format(v)+'×';if(k.metrica==='qtd')return String(v);return Math.round(v)+' d';}
function pedDataProc(p){const ds=[...new Set(p.itens.map(pi=>pi.pedidoId))].map(id=>(pedido(id)||{}).data).filter(Boolean).sort();return ds[0]||'';}

    h+=`<div class="card"><h3>Itens do pedido</h3><div class="tw"><table class="grid"><thead><tr><th>Produto / configuração</th><th>Descrição (vazio = gerada)</th><th>NCM</th><th>Qtd</th><th>Un</th><th>Vlr unit. (${esc(m)})</th><th class="r">Total</th><th>Peso un. (kg)</th><th>Pronto previsto</th><th>Pronto real</th><th>Situação</th><th></th></tr></thead>

function pedPagamentos(pe,P,pg){const m=pe.moeda||'';
  const procOpts=[['','— todo o pedido —'],...pedProcs(pe).map(p=>[p.id,p.numero])];
  const rows=pe.parcelas.map((pa,i)=>{const Q=P+'.parcelas.'+i,v=vencParcela(pe,pa),val=valorParcela(pe,pa);
    const tx=n(pa.taxa)||cot(m),d=v.d?diasAte(v.d):null;
    const st=pa.pago?'<span class="pill lv-ok">pago</span>':d==null?'<span class="note">sem data</span>':d<0?`<span class="pill lv-alto">vencida ${-d} d</span>`:d<=7?`<span class="pill lv-medio">${d} d</span>`:`<span class="pill lv-info">${d} d</span>`;
    return `<tr><td>${inp(Q+'.desc',pa.desc,{cls:'w-m',ph:'Antecipação / Saldo…'})}</td><td>${inp(Q+'.pct',pa.pct,{type:'num',cls:'w-xs'})}</td>
    <td>${sel(Q+'.evento',pa.evento,optsObj(EVENTOS))}</td><td>${inp(Q+'.dias',pa.dias,{type:'num',cls:'w-xs'})}</td>
    <td>${inp(Q+'.valor',pa.valor,{type:'num',cls:'w-m',ph:NF2.format(val)})}</td>
    <td><input data-b="${Q}.venc" type="date" value="${esc(v.d)}" title="${v.man?'vencimento manual':'calculado pelo evento'}">${v.man?`<button class="mini" title="voltar ao cálculo automático" onclick="vencAuto('${Q}')">↺ auto</button>`:v.est&&v.d?'<div class="note" style="margin:0">previsto</div>':''}</td>
    <td>${sel(Q+'.processoId',pa.processoId,procOpts,{cls:'w-m'})}</td>
    <td>${inp(Q+'.pago',pa.pago,{type:'date'})}</td><td>${sel(Q+'.contratoId',pa.contratoId,optsL(db.contratos.filter(c=>!c.moeda||c.moeda===m),c=>c.numero+' · '+(c.banco||''),'—'),{cls:'w-m'})}</td>
    <td>${inp(Q+'.taxa',pa.taxa,{type:'num',cls:'w-s',ph:NF4.format(cot(m))})}</td><td class="r">${brl(val*tx)}</td><td>${st}</td>
    <td class="noprint"><button class="mini" title="dividir em dois documentos" onclick="dividirParcela('${pe.id}',${i})">dividir</button> <button class="mini" title="um documento de saldo por embarque (ex.: SinoSure)" onclick="ratearEmbarques('${pe.id}',${i})">por embarque</button> <button class="mini danger" onclick="delLinha('${P}.parcelas',${i})">✕</button></td></tr>`;}).join('');
  return `<div class="card"><h3>Parcelas (antecipação, saldos)</h3>
  <div class="tw"><table class="grid"><thead><tr><th>Descrição</th><th>%</th><th>Evento</th><th>+ dias</th><th>Valor (${esc(m)})</th><th>Vencimento</th><th>Embarque</th><th>Pago em</th><th>Contrato câmbio</th><th>Taxa</th><th class="r">R$</th><th>Situação</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="13" class="empty">Nenhuma parcela. Escolha a condição de pagamento do pedido ou adicione manualmente.</td></tr>'}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button onclick="addParcela('${P}')">+ parcela</button><button onclick="regerarParcelas('${pe.id}')">gerar pela condição de pagamento</button></div>
  <p class="note">O vencimento é recalculado pelo evento (ex.: saldo 90% = produção pronta + N dias). Se o pedido ficar pronto antes, informe a data real nos itens e o vencimento antecipa sozinho. Editar a data manualmente fixa o vencimento (↺ volta ao automático). "Por embarque" gera um documento de saldo para cada embarque parcial.</p></div>
  <div class="sum"><div class="card"><table><tr><td>Total do pedido</td><td class="r">${mo(pg.tot,m)}</td></tr><tr><td>Programado em parcelas</td><td class="r">${mo(pg.prog,m)}</td></tr>
  <tr><td>Pago</td><td class="r">${mo(pg.pago,m)} (${pct(pg.pctPago)})</td></tr><tr class="tot"><td>Falta pagar</td><td class="r">${mo(pg.falta,m)}</td></tr>
  ${Math.abs(pg.prog-pg.tot)>0.01?`<tr><td colspan="2"><span class="pill lv-medio">parcelas somam ${mo(pg.prog,m)} — diferente do total do pedido</span></td></tr>`:''}</table></div></div>`;}

// ----- Produção (PCP) -----
function vProd(){
  const rows=[];db.pedidos.filter(pedAtivo).forEach(pe=>pe.itens.forEach((it,i)=>{const st=prodStatus(it);if(st==='embarcado')return;rows.push({pe,it,i,st,qi:qtdInfo(it),pp:prontoPrev(pe,it)});}));
  rows.sort((a,b)=>(a.it.prontoReal||a.pp||'9').localeCompare(b.it.prontoReal||b.pp||'9'));
  const cor=r=>{if(r.it.prontoReal)return 'verde';if(!r.pp)return '';const d=diasAte(r.pp);return d<0?'vermelho':d<=n(db.config.alertaPronto)?'amarelo':'';};
  const nsel=Object.values(ui.prodSel).filter(Boolean).length;
  return `<div class="card"><div class="row"><h3 style="margin:0">Acompanhamento de produção e saldo a embarcar</h3>
    <button class="primary right" onclick="embarcarSelecionados()" ${nsel?'':'disabled'}>criar embarque com ${nsel} selecionado(s)</button></div>
    <div class="legend"><span>${sem('vermelho')}produção atrasada</span><span>${sem('amarelo')}pronto em até ${db.config.alertaPronto} dias</span><span>${sem('verde')}pronto, aguardando embarque</span></div>
  <div class="tw"><table class="grid"><thead><tr><th></th><th>Pedido</th><th>Fornecedor</th><th>Item</th><th class="r">Qtd</th><th class="r">Alocado</th><th class="r">Saldo</th><th>Pronto previsto</th><th>Pronto real</th><th class="r">Dias</th><th>Situação</th><th class="r">Pedido pago</th><th class="r">Falta pagar</th></tr></thead><tbody>
  ${rows.map(r=>{const Q=`pedidos.${db.pedidos.indexOf(r.pe)}.itens.${r.i}`,pg=pagInfo(r.pe),d=r.pp&&!r.it.prontoReal?diasAte(r.pp):null;
    return `<tr class="r-${cor(r)}"><td>${r.qi.saldo>0?`<input type="checkbox" ${ui.prodSel[r.it.id]?'checked':''} onchange="ui.prodSel['${r.it.id}']=this.checked;render()">`:''}</td>
    <td><a href="#" onclick="abrirPed('${r.pe.id}');return false">${esc(r.pe.numero)}</a></td><td>${esc(fornNome(r.pe.fornecedorId))}</td><td><b>${esc(codItem(r.it))}</b> ${esc(descItem(r.it))}</td>
    <td class="r">${n(r.it.qtd)}</td><td class="r">${r.qi.aloc}</td><td class="r"><b>${r.qi.saldo}</b></td>
    <td>${inp(Q+'.prontoPrev',r.it.prontoPrev,{type:'date',ph:r.pe.prontoPrev})}${!r.it.prontoPrev&&r.pe.prontoPrev?`<div class="note" style="margin:0">pedido: ${fd(r.pe.prontoPrev)}</div>`:''}</td><td>${inp(Q+'.prontoReal',r.it.prontoReal,{type:'date'})}</td>
    <td class="r">${d==null?'—':d}</td><td><span class="pill ${PSTAT[r.st][1]}">${PSTAT[r.st][0]}</span></td><td class="r">${pct(pg.pctPago)}</td><td class="r">${mo(pg.falta,r.pe.moeda)}</td></tr>`;}).join('')||'<tr><td colspan="13" class="empty">Nenhum item em produção ou aguardando embarque.</td></tr>'}
  </tbody></table></div><p class="note">Selecione itens do mesmo fornecedor e moeda para montar um embarque (total ou parcial). A quantidade pode ser ajustada dentro do embarque.</p></div>`;}

// ----- Lista de embarques -----
function filtrados(){
  const f=ui.f,q=f.q.trim().toLowerCase();
  return db.processos.filter(p=>{
    if(f.grp==='ativos'&&!ativo(p))return false;if(f.grp&&f.grp!=='ativos'&&grp(p)!==f.grp)return false;
    if(f.modal&&p.modal!==f.modal)return false;if(f.forn&&p.fornecedorId!==f.forn)return false;if(f.sit&&p.situacaoId!==f.sit)return false;
    if(q){const hay=[p.numero,p.ref,p.invoice,p.conhecimento,p.duimp,p.protocolo,p.containers,p.veiculo,fornNome(p.fornecedorId),...procItens(p).map(x=>x.cod+' '+x.desc+' '+x.ncm+' '+(x.pe?x.pe.numero:'')+' '+(x.pi.series||''))].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;});}
function vLista(){
  const f=ui.f;

    <input data-ui="q" placeholder="Buscar nº, PO, invoice, BL, DUIMP, container, item, série…" value="${esc(f.q)}">
    <select data-ui="grp"><option value="">Todos os status</option><option value="ativos"${f.grp==='ativos'?' selected':''}>Somente ativos</option>${Object.entries(GROUPS).map(([k,t])=>`<option value="${k}"${f.grp===k?' selected':''}>${t}</option>`).join('')}</select>
    <select data-ui="sit"><option value="">Todas as situações</option>${db.config.situacoes.map(s=>`<option value="${s.id}"${f.sit===s.id?' selected':''}>${esc(s.nome)}</option>`).join('')}</select>
    <select data-ui="modal"><option value="">Todos os modais</option>${Object.entries(MODAIS).map(([k,t])=>`<option value="${k}"${f.modal===k?' selected':''}>${t}</option>`).join('')}</select>
    <select data-ui="forn"><option value="">Todos os fornecedores</option>${db.fornecedores.map(x=>`<option value="${x.id}"${f.forn===x.id?' selected':''}>${esc(x.nome||'(sem nome)')}</option>`).join('')}</select>
    <button onclick="csvProcessos()">⤓ CSV</button>
    <label class="btn" title="CSV do agente de carga: referência;evento;data">⤒ status do agente<input type="file" accept=".csv,.txt" hidden onchange="importStatus(this)"></label>
  </div><div id="plist">${listaBody()}</div>`;}
function listaBody(){
  CALC.clear();const L=filtrados();
  if(!L.length)return `<div class="card empty-state">Nenhum embarque encontrado.<br><button class="primary" onclick="novoProc()">+ novo embarque</button></div>`;
  return `<div class="tw"><table><thead><tr><th>Embarque</th><th>Fornecedor</th><th>Pedidos</th><th>Modal</th><th>ETA</th><th>Status</th><th>Situação</th><th>Canal</th><th class="r">Valor aduaneiro</th><th class="r">Custo total</th><th>Alertas</th></tr></thead><tbody>${L.map(p=>{const T=C(p),a=alertasProc(p);
    return `<tr class="click" onclick="abrir('${p.id}')"><td>${sem(semaforo(a))}<b>${esc(p.numero)}</b>${p.ref?`<div class="note" style="margin:0">${esc(p.ref)}</div>`:''}</td><td>${esc(fornNome(p.fornecedorId))}</td><td>${[...new Set(procItens(p).map(x=>x.pe&&x.pe.numero).filter(Boolean))].map(esc).join(', ')||'—'}</td><td>${MODAIS[p.modal]||'—'}</td><td>${fd(p.eta)}</td><td>${pill(p)}</td><td>${sitPill(p.situacaoId)}</td><td>${canalPill(p.canal)}</td><td class="r">${brl(T.va)}</td><td class="r">${brl(T.total)}</td><td>${a.length?`<span class="pill lv-${semaforo(a)==='vermelho'?'alto':'medio'}">${a.length}</span>`:''}</td></tr>`;}).join('')}</tbody></table></div><p class="note">${L.length} embarque(s).</p>`;}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.ui;if(!k)return;ui.f[k]=e.target.value;const h=document.getElementById('plist');if(h)h.innerHTML=listaBody();});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ui;if(!k||e.target.tagName!=='SELECT')return;ui.f[k]=e.target.value;const h=document.getElementById('plist');if(h)h.innerHTML=listaBody();});

const SUBS=[['geral','Dados gerais'],['itens','Itens & séries'],['custos','Custos & rateio'],['numerario','Numerário & pagamentos'],['etapas','Etapas & prazos'],['docs','Documentos'],['nf','Espelho NF entrada'],['hist','Histórico']];
function vProc(){
  const idx=db.processos.findIndex(x=>x.id===ui.pid);if(idx<0){ui.view='processos';return vLista();}
  const p=db.processos[idx],P='processos.'+idx,T=C(p),si=stageIdx(p),al=alertasProc(p);
  let h=`<div class="phead"><div><h2>${sem(semaforo(al))}${esc(p.numero)} ${pill(p)} ${sitPill(p.situacaoId)} ${p.canal?canalPill(p.canal):''}</h2>
    <div class="meta">${esc(fornNome(p.fornecedorId))} · ${MODAIS[p.modal]||'—'} · ${esc(p.incoterm||'—')} · ${esc(p.moeda||'')} · ${esc((filial(p.filialId)||{}).nome||'filial não informada')} · resp.: ${esc((pessoa(p.responsavelId)||{}).nome||'—')}</div></div>
    <div class="row noprint"><button onclick="go('processos')">← voltar</button><button onclick="followup('${p.id}')">✉ follow-up</button><button onclick="duplicar('${p.id}')">duplicar</button><button onclick="imprimir()">imprimir</button>
    <button onclick="cancelar('${p.id}')">${p.cancelado?'reativar':'cancelar'}</button><button class="danger" onclick="excluir('${p.id}')">excluir</button></div></div>`;

  if(al.length)h+=`<div class="card" style="padding:10px 14px"><ul class="alerts">${al.map(a=>`<li style="cursor:default"><span class="pill lv-${a.lvl}">${LVTXT[a.lvl]}</span><span>${esc(a.msg)}</span></li>`).join('')}</ul></div>`;
  h+=`<div class="subtabs">${SUBS.map(([k,t])=>`<button class="${ui.sub===k?'on':''}" onclick="ui.sub='${k}';render()">${t}</button>`).join('')}</div>`;
  const parts={geral:()=>pGeral(p,P),itens:()=>pItens(p,P,T),custos:()=>pCustos(p,P,T),numerario:()=>pNumerario(p,P,T),etapas:()=>pEtapas(p,P),docs:()=>pDocs(p,P),nf:()=>pNF(p,T),hist:()=>histCard(p,'proc')};
  if(ui.sub==='all')h+=SUBS.map(([k,t])=>`<h2>${t}</h2>`+parts[k]()).join('');else h+=(parts[ui.sub]||parts.geral)();
  return h;}
function customFields(ent,P,o){const L=db.config.campos.filter(c=>c.ent===ent);if(!L.length)return '';

    ${fld('Modal',sel(P+'.modal',p.modal,optsObj(MODAIS)))}${fld('Agente de carga',sel(P+'.agenteId',p.agenteId,ag('Agente de carga')))}
    ${fld('Conhecimento (BL / AWB / CRT)',inp(P+'.conhecimento',p.conhecimento))}${fld('Navio / voo / veículo',inp(P+'.veiculo',p.veiculo))}
    ${fld('Qtd. containers',inp(P+'.qtdCont',p.qtdCont,{type:'num'}))}${fld('Container(s)',inp(P+'.containers',p.containers,{ph:'ex.: 2x40HC MSCU1234567'}))}

    ${['ii','ipi','pis','cofins','icms'].map(k=>`<td>${inp(Q+'.'+k,x.pi[k],{type:'num',cls:'w-xs'})}</td>`).join('')}
    <td>${ta(Q+'.series',x.pi.series,'sn')}${x.serial||ns?`<div class="note" style="margin:0">${ns}/${x.q} série(s)${x.serial&&ns!==x.q?' <span class="pill lv-medio">conferir</span>':''}</div>`:''}</td>

    ${av.map(a=>`<tr><td>${esc(a.pe.numero)}</td><td><b>${esc(codItem(a.it))}</b> ${esc(descItem(a.it))}</td><td><span class="pill ${PSTAT[prodStatus(a.it)][1]}">${PSTAT[prodStatus(a.it)][0]}</span></td><td class="r">${a.s}</td><td><input type="number" step="any" min="0" max="${a.s}" class="w-s addq" data-ped="${a.pe.id}" data-it="${a.it.id}" placeholder="0"></td></tr>`).join('')}

  const peds=[...new Set(p.itens.map(pi=>pi.pedidoId))].map(pedido).filter(Boolean);
  return `<div class="card"><h3>Numerário ao despachante</h3>
  <div class="tw"><table class="grid"><thead><tr><th>Solicitado em</th><th>Valor (R$)</th><th>Vencimento</th><th>Pago em</th><th>Observação</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Nenhuma solicitação.</td></tr>'}</tbody></table></div>

    ${T.D.filter(x=>(x.d.via||x.t.via)==='despachante').map(x=>`<tr><td>${esc(x.nome)}</td><td class="r">${brl(x.val)}</td></tr>`).join('')}<tr class="tot"><td>Numerário sugerido</td><td class="r">${brl(T.numSug)}</td></tr></table>

    </tbody></table></div>`:'<p class="note">Sem pedidos vinculados.</p>'}</div>`;}

  return `<div class="sum"><div class="card"><h3>Datas realizadas</h3><table>${STAGES.map(s=>`<tr><td>${s.t}</td><td style="width:170px">${inp(P+'.etapas.'+s.k,e[s.k],{type:'date'})}</td></tr>`).join('')}</table>

    <tr><td>Embarque</td><td class="r">prev. ${fd(p.etd)} · real ${fd(e.embarque)}${p.etd&&e.embarque?` (${diasEntre(p.etd,e.embarque)>0?'+':''}${diasEntre(p.etd,e.embarque)} d)`:''}</td></tr>
    <tr><td>Chegada</td><td class="r">prev. ${fd(p.eta)} · real ${fd(e.chegada)}${p.eta&&e.chegada?` (${diasEntre(p.eta,e.chegada)>0?'+':''}${diasEntre(p.eta,e.chegada)} d)`:''}</td></tr></table></div>

  ${p.modal==='maritimo'?`<div class="card"><h3>Free time / demurrage</h3>${dm.ini?`<p>Chegada ${fd(dm.ini)} + ${dm.ft} dias = free time até <b>${fd(dm.lim)}</b>. ${p.devolucao?`Devolvido em ${fd(p.devolucao)}.`:''}

// ----- Financeiro -----
function fluxoEntries(){
  const E=[];
  db.pedidos.forEach(pe=>{if(pe.cancelado)return;pe.parcelas.forEach(pa=>{if(pa.pago)return;const v=vencParcela(pe,pa),val=valorParcela(pe,pa),tx=n(pa.taxa)||cot(pe.moeda);
    E.push({d:v.d,est:v.est,tipo:'Fornecedor',desc:`${pa.desc||EVENTOS[pa.evento]} ${has(pa.pct)&&!has(pa.valor)&&!/%/.test(pa.desc||'')?'('+NF2.format(pa.pct).replace(',00','')+'%) ':''}— ${pe.numero} · ${fornNome(pe.fornecedorId)}`,orig:mo(val,pe.moeda),brl:val*tx,filialId:pe.filialId,go:`ui.psub='pag';abrirPed('${pe.id}')`});});});
  db.processos.forEach(p=>{if(!ativo(p))return;const T=C(p);
    p.numerarios.forEach(x=>{if(x.pago)return;E.push({d:x.venc||x.data,est:false,tipo:'Numerário',desc:`Numerário — ${p.numero}`,orig:brl(x.valor),brl:n(x.valor),filialId:p.filialId,go:`ui.sub='numerario';abrir('${p.id}')`});});
    const falta=T.numSug-sum(p.numerarios,'valor');if(!p.etapas.desembaraco&&falta>1){const d=p.etapas.chegada||p.eta;E.push({d,est:true,tipo:'Numerário',desc:`Numerário (projeção) — ${p.numero}`,orig:brl(falta),brl:falta,filialId:p.filialId,go:`ui.sub='numerario';abrir('${p.id}')`});}
    if(p.modal==='maritimo'&&!p.etapas.registro&&T.afrmm>0&&!has(p.afrmmPago)){E.push({d:p.etapas.chegada||p.eta,est:true,tipo:'Tributo',desc:`AFRMM — ${p.numero}`,orig:brl(T.afrmm),brl:T.afrmm,filialId:p.filialId,go:`ui.sub='custos';abrir('${p.id}')`});}
    T.D.forEach(x=>{const via=x.d.via||x.t.via;if(via!=='direto'||x.d.status==='paga'||!x.val)return;E.push({d:x.d.venc||p.etapas.entrega||p.eta,est:!x.d.venc,tipo:x.d.status==='enviada'?'Despesa (no financeiro)':'Despesa',desc:`${x.nome} — ${p.numero}`,orig:brl(x.val),brl:x.val,filialId:p.filialId,go:`ui.sub='custos';abrir('${p.id}')`});});});
  const h=hoje();E.forEach(x=>{if(x.est&&x.d&&x.d<h)x.d=h;});
  return E;}

  if(ui.fin==='parcelas'){const L=[];db.pedidos.forEach(pe=>{if(pe.cancelado)return;pe.parcelas.forEach(pa=>L.push({pe,pa,v:vencParcela(pe,pa)}));});

function vRel(){
  const tabs=[['gerencial','Gerencial'],['construtor','Construtor de relatórios']];
  let h=`<div class="subtabs">${tabs.map(([k,t])=>`<button class="${ui.rel===k?'on':''}" onclick="ui.rel='${k}';render()">${t}</button>`).join('')}</div>`;
  if(ui.rel==='construtor')return h+vBuilder();
  const P=db.processos.filter(p=>!p.cancelado);const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(0):'—';
  const fa={};P.forEach(p=>{const k=p.fornecedorId||'',T=C(p),a=fa[k]||(fa[k]={n:0,fob:0,total:0,trib:0,lead:[],atraso:[]});a.n++;a.fob+=T.fobBRL;a.total+=T.total;a.trib+=T.trib;
    const d=pedDataProc(p);if(d&&p.etapas.entrega)a.lead.push(diasEntre(d,p.etapas.entrega));if(p.eta&&p.etapas.chegada)a.atraso.push(diasEntre(p.eta,p.etapas.chegada));});
  const na={};P.forEach(p=>C(p).itens.forEach(y=>{const k=y.x.ncm||'(sem NCM)',a=na[k]||(na[k]={n:0,va:0,trib:0,total:0});a.n++;a.va+=y.vai;a.trib+=y.trib;a.total+=y.total;}));
  const ma={};P.forEach(p=>{const e=p.etapas;if(!(e.embarque&&e.chegada))return;const a=ma[p.modal]||(ma[p.modal]={t:[],ad:[]});a.t.push(diasEntre(e.embarque,e.chegada));if(e.desembaraco)a.ad.push(diasEntre(e.chegada,e.desembaraco));});
  const ca={};P.forEach(p=>{if(p.canal)ca[p.canal]=(ca[p.canal]||0)+1;});
  return h+`<div class="card"><h3>Por fornecedor</h3><div class="tw"><table><thead><tr><th>Fornecedor</th><th class="r">Embarques</th><th class="r">Mercadoria (R$)</th><th class="r">Tributos</th><th class="r">Custo total</th><th class="r">Fator</th><th class="r">Lead time</th><th class="r">Atraso ETA</th></tr></thead><tbody>
  ${Object.entries(fa).map(([k,a])=>`<tr><td>${esc((forn(k)||{}).nome||'(não informado)')}</td><td class="r">${a.n}</td><td class="r">${brl(a.fob)}</td><td class="r">${brl(a.trib)}</td><td class="r">${brl(a.total)}</td><td class="r">${a.fob?NF2.format(a.total/a.fob)+'×':'—'}</td><td class="r">${avg(a.lead)} d</td><td class="r">${avg(a.atraso)} d</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sem dados.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Por NCM</h3><div class="tw"><table><thead><tr><th>NCM</th><th>Descrição</th><th class="r">Itens</th><th class="r">Valor aduaneiro</th><th class="r">Tributos</th><th class="r">Carga</th><th class="r">Custo total</th></tr></thead><tbody>
  ${Object.entries(na).sort((a,b)=>b[1].total-a[1].total).map(([k,a])=>`<tr><td>${esc(k)}</td><td>${esc((ncmRec(k)||{}).descricao||'')}</td><td class="r">${a.n}</td><td class="r">${brl(a.va)}</td><td class="r">${brl(a.trib)}</td><td class="r">${a.va?pct(a.trib/a.va*100):'—'}</td><td class="r">${brl(a.total)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem dados.</td></tr>'}</tbody></table></div></div>
  <div class="sum"><div class="card"><h3>Tempos por modal</h3><table><thead><tr><th>Modal</th><th class="r">Trânsito</th><th class="r">Chegada → desembaraço</th></tr></thead><tbody>
  ${Object.entries(ma).map(([k,a])=>`<tr><td>${MODAIS[k]||k}</td><td class="r">${avg(a.t)} d</td><td class="r">${avg(a.ad)} d</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados.</td></tr>'}</tbody></table></div>
  <div class="card"><h3>Canais de parametrização</h3><table><tbody>${Object.entries(CANAIS).filter(([k])=>k).map(([k])=>`<tr><td>${canalPill(k)}</td><td class="r">${ca[k]||0}</td></tr>`).join('')}</tbody></table></div></div>`;}
function vBuilder(){
  const rb=ui.rb,E=getFields()[rb.ent];if(!rb.cols)rb.cols=E.def.slice();
  const F=E.f.filter(f=>rb.cols.includes(f[0])).sort((a,b)=>rb.cols.indexOf(a[0])-rb.cols.indexOf(b[0]));
  const q=(rb.q||'').toLowerCase();const rows=E.rows().map(r=>F.map(f=>f[2](r))).filter(v=>!q||v.join(' ').toLowerCase().includes(q));
  const fmt=(v,f)=>f[3]==='n'&&v!=null&&v!==''?NF2.format(v):esc(v??'');
  return `<div class="card"><div class="form">
    ${fld('Base',`<select onchange="ui.rb={ent:this.value,cols:null,q:''};render()">${Object.entries(getFields()).map(([k,v])=>`<option value="${k}"${rb.ent===k?' selected':''}>${v.nome}</option>`).join('')}</select>`)}
    ${fld('Filtrar',`<input value="${esc(rb.q)}" placeholder="texto em qualquer coluna" onchange="ui.rb.q=this.value;render()">`)}
    ${fld('Relatórios salvos',`<div class="row" style="flex-wrap:nowrap"><select onchange="if(this.value)loadRel(this.value)"><option value="">—</option>${db.config.relatorios.map(r=>`<option value="${r.id}">${esc(r.nome)}</option>`).join('')}</select><button class="mini" onclick="saveRel()">salvar atual</button></div>`)}
  </div><h3 style="margin-top:12px">Colunas</h3><div class="chips">${E.f.map(f=>`<label><input type="checkbox" ${rb.cols.includes(f[0])?'checked':''} onchange="toggleCol('${f[0]}',this.checked)">${esc(f[1])}</label>`).join('')}</div></div>
  <div class="row" style="margin-bottom:8px"><b>${rows.length} linha(s)</b><button class="right" onclick="csvBuilder()">⤓ CSV / Excel</button></div>
  <div class="tw"><table><thead><tr>${F.map(f=>`<th class="${f[3]==='n'?'r':''}">${esc(f[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(v=>`<tr>${v.map((x,i)=>`<td class="${F[i][3]==='n'?'r':''}">${fmt(x,F[i])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${F.length||1}" class="empty">Sem dados.</td></tr>`}</tbody></table></div>`;}
window.toggleCol=(k,on)=>{const c=ui.rb.cols;if(on&&!c.includes(k))c.push(k);if(!on)ui.rb.cols=c.filter(x=>x!==k);render();};
window.saveRel=()=>{const nm=prompt('Nome do relatório:');if(!nm)return;db.config.relatorios.push({id:uid(),nome:nm,ent:ui.rb.ent,cols:ui.rb.cols.slice(),q:ui.rb.q||''});save();render();};
window.loadRel=id=>{const r=byId(db.config.relatorios,id);if(!r)return;ui.rb={ent:r.ent,cols:r.cols.slice(),q:r.q||''};render();};

  ${L.map((r,i)=>`<tr>${cols.map(c=>`<td>${c[2]==='sel'?sel(`${key}.${i}.${c[0]}`,r[c[0]],c[3]):c[2]==='bool'?chk(`${key}.${i}.${c[0]}`,r[c[0]]):inp(`${key}.${i}.${c[0]}`,r[c[0]],{type:c[2]||'text',cls:c[3]||'',list:c[4],ph:c[5]})}</td>`).join('')}${extra?extra(r):''}<td><button class="mini danger" onclick="delCad('${key}',${i})">✕</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1+(extraH||[]).length}" class="empty">Nenhum registro.</td></tr>`}

function numProc(){db.seq.proc++;return `IMP-${hoje().slice(0,4)}-${String(db.seq.proc).padStart(3,'0')}`;}
function novoProcObj(o){const p=Object.assign({id:uid(),numero:numProc(),criado:hoje(),moeda:'USD',modal:'maritimo',incoterm:'FOB',tipoImp:'Própria',rateioFrete:'valor',qtdCont:1,
  itens:[],despesas:[],numerarios:[],etapas:{},docs:{},custom:{},links:[],log:[]},o||{});aplicarAuto(p);log(p,'Embarque criado');return p;}
function aplicarAuto(p){db.despTipos.filter(t=>t.auto&&(!t.modal||t.modal===p.modal)&&!p.despesas.some(d=>d.tipoId===t.id)).forEach(t=>p.despesas.push({id:uid(),tipoId:t.id,via:t.via||'despachante',status:'aberta'}));}
window.aplicarDespAuto=id=>{const p=processo(id);aplicarAuto(p);save();render();};
window.novoProc=()=>{const p=novoProcObj();db.processos.unshift(p);save();ui.sub='geral';abrir(p.id);};
function addPI(p,pe,it,q){const nc=ncmRec(ncmItem(it))||{},F=filial(p.filialId)||{};
  p.itens.push({id:uid(),pedidoId:pe.id,pedItemId:it.id,qtd:q,ii:nc.ii??null,ipi:nc.ipi??null,pis:nc.pis??null,cofins:nc.cofins??null,icms:has(F.icms)?F.icms:db.config.icms});}
window.criarEmbarque=pedId=>{const pe=pedido(pedId);const av=pe.itens.filter(it=>qtdInfo(it).saldo>0);if(!av.length){alert('Este pedido não tem saldo a embarcar.');return;}
  const p=novoProcObj({fornecedorId:pe.fornecedorId,filialId:pe.filialId,moeda:pe.moeda,incoterm:pe.incoterm});av.forEach(it=>addPI(p,pe,it,qtdInfo(it).saldo));
  db.processos.unshift(p);log(pe,`Embarque ${p.numero} criado`);save();ui.sub='itens';abrir(p.id);};
window.embarcarSelecionados=()=>{const sel=[];db.pedidos.forEach(pe=>pe.itens.forEach(it=>{if(ui.prodSel[it.id])sel.push({pe,it});}));if(!sel.length)return;
  const fs=new Set(sel.map(s=>s.pe.fornecedorId)),ms=new Set(sel.map(s=>s.pe.moeda));if(fs.size>1||ms.size>1){alert('Selecione itens de um único fornecedor e moeda.');return;}
  const pe0=sel[0].pe;const p=novoProcObj({fornecedorId:pe0.fornecedorId,filialId:pe0.filialId,moeda:pe0.moeda,incoterm:pe0.incoterm});
  sel.forEach(s=>{const q=qtdInfo(s.it).saldo;if(q>0)addPI(p,s.pe,s.it,q);});[...new Set(sel.map(s=>s.pe))].forEach(pe=>log(pe,`Embarque ${p.numero} criado`));
  db.processos.unshift(p);ui.prodSel={};save();ui.sub='itens';abrir(p.id);};
window.addSelecionados=pid=>{const p=processo(pid);let k=0;document.querySelectorAll('.addq').forEach(i=>{const q=n(i.value);if(q<=0)return;const pe=pedido(i.dataset.ped),it=pe.itens.find(x=>x.id===i.dataset.it);const s=qtdInfo(it).saldo;
  if(!p.fornecedorId){p.fornecedorId=pe.fornecedorId;p.moeda=pe.moeda;p.filialId=p.filialId||pe.filialId;p.incoterm=p.incoterm||pe.incoterm;}addPI(p,pe,it,Math.min(q,s));k++;});
  if(k){log(p,`${k} item(ns) adicionados de pedidos`);ui.showAdd=false;save();render();}};
window.duplicar=id=>{const o=processo(id);const p=novoProcObj({fornecedorId:o.fornecedorId,filialId:o.filialId,moeda:o.moeda,incoterm:o.incoterm,modal:o.modal,recintoId:o.recintoId,despachanteId:o.despachanteId,agenteId:o.agenteId,origem:o.origem,destino:o.destino,freeTime:o.freeTime,demurrageDia:o.demurrageDia,demurrageMoeda:o.demurrageMoeda});
  log(p,'Criado a partir de '+o.numero+' (sem itens)');db.processos.unshift(p);save();ui.sub='geral';abrir(p.id);};
window.cancelar=id=>{const p=processo(id);p.cancelado=!p.cancelado;log(p,p.cancelado?'Embarque cancelado (itens voltam ao saldo do pedido)':'Embarque reativado');save();render();};
window.excluir=id=>{const p=processo(id);if(!confirm(`Excluir definitivamente o embarque ${p.numero}? Os itens voltam ao saldo dos pedidos.`))return;db.processos=db.processos.filter(x=>x.id!==id);
  db.pedidos.forEach(pe=>pe.parcelas.forEach(pa=>{if(pa.processoId===id)pa.processoId='';}));save();go('processos');};
window.novoPed=()=>{db.seq.ped++;const pe={id:uid(),numero:`PED-${hoje().slice(0,4)}-${String(db.seq.ped).padStart(3,'0')}`,data:hoje(),moeda:'USD',itens:[],parcelas:[],custom:{},log:[]};
  log(pe,'Pedido criado');db.pedidos.unshift(pe);save();ui.psub='geral';abrirPed(pe.id);};
window.addPedItem=P=>{getPath(P+'.itens').push({id:uid(),qtd:1,un:'UN',attrs:{}});save();render();};
window.pedFlag=(id,k)=>{const pe=pedido(id);pe[k]=!pe[k];log(pe,`Pedido ${pe[k]?k:(k==='cancelado'?'reativado':'reaberto')}`);save();render();};
window.excluirPed=id=>{const pe=pedido(id);const pr=pedProcs(pe);if(pr.length){alert('Este pedido tem embarques vinculados ('+pr.map(p=>p.numero).join(', ')+'). Remova os itens dos embarques antes ou cancele o pedido.');return;}
  if(!confirm(`Excluir o pedido ${pe.numero}?`))return;db.pedidos=db.pedidos.filter(x=>x.id!==id);save();go('pedidos');};
window.addParcela=P=>{getPath(P+'.parcelas').push({id:uid(),evento:'pedido',dias:0});save();render();};
window.regerarParcelas=id=>{const pe=pedido(id);if(!pe.condicaoId){alert('Escolha a condição de pagamento do pedido.');return;}
  if(pe.parcelas.some(x=>!x.pago)&&!confirm('Substituir as parcelas em aberto pelas da condição de pagamento?'))return;gerarParcelas(pe);log(pe,'Parcelas geradas pela condição de pagamento');save();render();};
window.vencAuto=Q=>{const pa=getPath(Q);pa.vencManual=false;pa.venc='';save();render();};
window.dividirParcela=(id,i)=>{const pe=pedido(id),pa=pe.parcelas[i],v=valorParcela(pe,pa);const r=prompt(`Valor do primeiro documento (total ${mo(v,pe.moeda)}):`,NF2.format(v/2));if(r==null)return;
  const a=Number(String(r).replace(/\./g,'').replace(',','.'));if(!(a>0&&a<v)){alert('Valor inválido.');return;}
  const b=Object.assign({},pa,{id:uid(),valor:Math.round((v-a)*100)/100,pct:null,desc:(pa.desc||EVENTOS[pa.evento])+' (2)',pago:'',contratoId:''});pa.valor=a;pa.pct=null;pa.desc=(pa.desc||EVENTOS[pa.evento])+' (1)';
  pe.parcelas.splice(i+1,0,b);log(pe,`Parcela dividida: ${mo(a,pe.moeda)} + ${mo(b.valor,pe.moeda)}`);save();render();};
window.ratearEmbarques=(id,i)=>{const pe=pedido(id),pa=pe.parcelas[i];if(pa.pago){alert('Parcela já paga.');return;}const pr=pedProcs(pe);if(!pr.length){alert('Este pedido ainda não tem embarques.');return;}
  const tot=totPed(pe),v=valorParcela(pe,pa);const novas=[];let used=0;
  pr.forEach(p=>{const val=procItens(p).filter(x=>x.pe===pe).reduce((s,x)=>s+x.q*x.vuPI,0);if(!val)return;const part=Math.round(v*val/tot*100)/100;used+=part;novas.push(Object.assign({},pa,{id:uid(),valor:part,pct:null,processoId:p.id,desc:(pa.desc||EVENTOS[pa.evento])+' — '+p.numero,vencManual:false,venc:''}));});
  const rest=Math.round((v-used)*100)/100;if(rest>0.009)novas.push(Object.assign({},pa,{id:uid(),valor:rest,pct:null,processoId:'',desc:(pa.desc||EVENTOS[pa.evento])+' — saldo não embarcado'}));
  pe.parcelas.splice(i,1,...novas);log(pe,`Parcela "${pa.desc||EVENTOS[pa.evento]}" desmembrada em ${novas.length} documento(s) por embarque`);save();render();};
window.addDesp=P=>{const id=document.getElementById('newDesp').value;const t=despTipo(id);getPath(P+'.despesas').push(t?{id:uid(),tipoId:t.id,via:t.via||'despachante',status:'aberta'}:{id:uid(),nome:'Nova despesa',via:'despachante',status:'aberta'});save();render();};
window.addNumerario=(id,sug)=>{const p=processo(id),T=calc(p);const v=sug?Math.max(0,Math.round((T.numSug-sum(p.numerarios,'valor'))*100)/100):null;
  if(sug&&!v){alert('O numerário já cobre o valor sugerido.');return;}p.numerarios.push({id:uid(),data:hoje(),valor:v,obs:sug?'calculado pelo sistema':''});if(sug)log(p,`Numerário solicitado: ${brl(v)}`);save();render();};
window.delLinha=(path,i)=>{if(!confirm('Remover esta linha?'))return;getPath(path).splice(i,1);save();render();};
window.addCad=key=>{const o={id:uid()};if(key==='filiais')Object.assign(o,{credIpi:true,credPisCofins:true,credIcms:true,regime:'Lucro real',icms:db.config.icms});
  if(key==='despTipos')Object.assign(o,{base:'fixo',grupo:'outra',rateio:'valor',via:'despachante'});if(key==='config.situacoes')o.cor='azul';if(key==='config.campos')Object.assign(o,{ent:'processo',tipo:'texto'});if(key==='config.kpis')o.metrica='qtd';
  getPath(key).push(o);save();render();};
window.delCad=(key,i)=>{const L=getPath(key),r=L[i];
  const refs={fornecedores:()=>db.processos.filter(p=>p.fornecedorId===r.id).length+db.pedidos.filter(p=>p.fornecedorId===r.id).length,agentes:()=>db.processos.filter(p=>p.despachanteId===r.id||p.agenteId===r.id).length,
    produtos:()=>db.pedidos.reduce((s,pe)=>s+pe.itens.filter(it=>it.produtoId===r.id).length,0),filiais:()=>db.processos.filter(p=>p.filialId===r.id).length,recintos:()=>db.processos.filter(p=>p.recintoId===r.id).length,
    despTipos:()=>db.processos.reduce((s,p)=>s+p.despesas.filter(d=>d.tipoId===r.id).length,0),condicoes:()=>db.pedidos.filter(p=>p.condicaoId===r.id).length,contratos:()=>db.pedidos.reduce((s,pe)=>s+pe.parcelas.filter(pa=>pa.contratoId===r.id).length,0)}[key];
  const uso=refs?refs():0;if(!confirm(uso?`Este cadastro é usado em ${uso} registro(s). Remover mesmo assim?`:'Remover este registro?'))return;L.splice(i,1);save();render();};
window.addNote=(id,tipo)=>{const el=document.getElementById('newNote');const t=(el.value||'').trim();if(!t)return;log(tipo==='ped'?pedido(id):processo(id),t);save();render();};
window.imprimir=()=>{const s=ui.sub;ui.sub='all';render();setTimeout(()=>{window.print();ui.sub=s;render();},50);};
window.limpar=()=>{if(!confirm('Apagar TODOS os dados deste navegador? Recomendamos baixar um backup antes.'))return;if(prompt('Digite APAGAR para confirmar')!=='APAGAR')return;db=blank();save();go('painel');};
function followGroup(k){const g=(db.config.followup||{})[k]||{};return db.pessoas.filter(x=>g[x.id]&&x.email);}
function mailto(p,k,extra){const s=STAGES[stageIndex(k)]||{t:statusTxt(p)};const to=(k?followGroup(k):db.pessoas.filter(x=>Object.values(db.config.followup||{}).some(g=>g[x.id])&&x.email)).map(x=>x.email);
  const T=C(p);const body=[`Embarque ${p.numero} — ${fornNome(p.fornecedorId)}`,extra||`Status: ${statusTxt(p)}`,`Pedidos: ${[...new Set(procItens(p).map(x=>x.pe&&x.pe.numero).filter(Boolean))].join(', ')||'—'}`,
    `Modal: ${MODAIS[p.modal]||'—'} · Conhecimento: ${p.conhecimento||'—'} · Containers: ${p.containers||'—'}`,`ETD ${fd(p.etd)} · ETA ${fd(p.eta)} · Chegada ${fd(p.etapas.chegada)}`,
    `DUIMP/DI: ${p.duimp||'—'} · Canal: ${CANAIS[p.canal||'']}`,`Valor aduaneiro: ${brl(T.va)} · Custo estimado: ${brl(T.total)}`,'',...alertasProc(p).map(a=>`[${LVTXT[a.lvl]}] ${a.msg}`)].join('\n');
  return {to,href:`mailto:${to.join(',')}?subject=${encodeURIComponent(`[Importação] ${p.numero} – ${s.t}`)}&body=${encodeURIComponent(body)}`};}
window.followup=id=>{const p=processo(id);const k=STAGES[stageIdx(p)]?STAGES[stageIdx(p)].k:null;const m=mailto(p,k);if(!m.to.length&&!confirm('Nenhum grupo de follow-up configurado para esta etapa (Cadastros → Pessoas & follow-up). Abrir o e-mail mesmo assim?'))return;
  log(p,'Follow-up enviado'+(m.to.length?' para '+m.to.join(', '):''));save();location.href=m.href;render();};

// efeitos colaterais de edições
function hooks(path,v,old){
  let m;
  if((m=path.match(/^processos\.(\d+)\.etapas\.(\w+)$/))){const p=db.processos[+m[1]],s=STAGES[stageIndex(m[2])];
    if(v&&v!==old){log(p,`Etapa "${s.t}" registrada em ${fd(v)}`);const g=followGroup(m[2]);if(g.length){const mt=mailto(p,m[2],`Etapa registrada: ${s.t} em ${fd(v)}`);ui.toast=`Etapa "${esc(s.t)}" registrada. <a href="${mt.href}" onclick="log(processo('${p.id}'),'Follow-up enviado: ${esc(s.t)}');save()">✉ Notificar ${g.map(x=>esc(x.nome)).join(', ')}</a>`;}}
    else if(!v&&old)log(p,`Data da etapa "${s.t}" removida`);}
  if((m=path.match(/^processos\.(\d+)\.canal$/))&&v)log(db.processos[+m[1]],`Canal de parametrização: ${CANAIS[v]}`);
  if((m=path.match(/^processos\.(\d+)\.situacaoId$/)))log(db.processos[+m[1]],`Situação: ${(situacao(v)||{}).nome||'—'}`);
  if((m=path.match(/^processos\.(\d+)\.itens\.(\d+)\.qtd$/))){const p=db.processos[+m[1]],pi=p.itens[+m[2]],pe=pedido(pi.pedidoId),it=pe&&pe.itens.find(i=>i.id===pi.pedItemId);
    if(it){const s=qtdInfo(it);if(s.saldo<0){pi.qtd=n(v)+s.saldo;alert(`Quantidade limitada ao saldo do pedido (${pi.qtd}).`);}}}
  if((m=path.match(/^processos\.(\d+)\.docs\.(\w+)\.ok$/))&&v){const d=DOCS.find(x=>x.k===m[2]);log(db.processos[+m[1]],`Documento recebido: ${d.t}`);}
  if((m=path.match(/^processos\.(\d+)\.despesas\.(\d+)\.status$/))){const p=db.processos[+m[1]],d=p.despesas[+m[2]];log(p,`Despesa "${d.nome||(despTipo(d.tipoId)||{}).nome}": ${DSTAT[v]}`);if(v==='paga'&&!d.pago)d.pago=hoje();}
  if((m=path.match(/^processos\.(\d+)\.despesas\.(\d+)\.pago$/))&&v){const d=db.processos[+m[1]].despesas[+m[2]];d.status='paga';}
  if((m=path.match(/^processos\.(\d+)\.numerarios\.(\d+)\.pago$/))&&v){const p=db.processos[+m[1]],x=p.numerarios[+m[2]];log(p,`Numerário de ${brl(x.valor)} pago em ${fd(v)}`);}
  if((m=path.match(/^processos\.(\d+)\.fornecedorId$/))){const p=db.processos[+m[1]],f=forn(v);if(f&&!p.itens.length){if(f.moeda)p.moeda=f.moeda;if(f.incoterm)p.incoterm=f.incoterm;}}
  if((m=path.match(/^processos\.(\d+)\.modal$/))){const p=db.processos[+m[1]];aplicarAuto(p);}
  if((m=path.match(/^pedidos\.(\d+)\.itens\.(\d+)\.produtoId$/))){const it=db.pedidos[+m[1]].itens[+m[2]];it.attrs={};const pr=produto(v);if(pr&&pr.un&&!it.un)it.un=pr.un;}
  if((m=path.match(/^pedidos\.(\d+)\.fornecedorId$/))){const pe=db.pedidos[+m[1]],f=forn(v);if(f){if(f.moeda)pe.moeda=f.moeda;if(f.incoterm)pe.incoterm=f.incoterm;if(f.condicaoId){pe.condicaoId=f.condicaoId;if(!pe.parcelas.length)gerarParcelas(pe);}
    if(n(f.prazo)&&!pe.prontoPrev&&pe.data)pe.prontoPrev=addDias(pe.data,n(f.prazo));}}
  if((m=path.match(/^pedidos\.(\d+)\.condicaoId$/))){const pe=db.pedidos[+m[1]];if(!pe.parcelas.some(x=>x.pago)){gerarParcelas(pe);log(pe,'Parcelas geradas pela condição de pagamento');}}
  if((m=path.match(/^pedidos\.(\d+)\.parcelas\.(\d+)\.venc$/))){const pa=db.pedidos[+m[1]].parcelas[+m[2]];pa.vencManual=!!v;if(v)log(db.pedidos[+m[1]],`Vencimento de "${pa.desc||EVENTOS[pa.evento]}" alterado para ${fd(v)}`);}
  if((m=path.match(/^pedidos\.(\d+)\.parcelas\.(\d+)\.contratoId$/))){const pa=db.pedidos[+m[1]].parcelas[+m[2]],c=contrato(v);if(c&&!has(pa.taxa))pa.taxa=c.taxa;}
  if((m=path.match(/^pedidos\.(\d+)\.parcelas\.(\d+)\.pago$/))&&v){const pe=db.pedidos[+m[1]],pa=pe.parcelas[+m[2]];log(pe,`Parcela "${pa.desc||EVENTOS[pa.evento]}" de ${mo(valorParcela(pe,pa),pe.moeda)} paga em ${fd(v)}`);}
  if((m=path.match(/^pedidos\.(\d+)\.itens\.(\d+)\.prontoReal$/))&&v){const pe=db.pedidos[+m[1]],it=pe.itens[+m[2]];log(pe,`Produção pronta: ${codItem(it)} em ${fd(v)}`);}
}
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.b)return;
  const path=el.dataset.b,t=el.dataset.t;
  const v=t==='num'?(el.value===''?null:Number(el.value)):t==='bool'?el.checked:el.value;
  const old=getPath(path);setPath(path,v);CALC.clear();hooks(path,v,old);save();
  setTimeout(()=>{const a=document.activeElement,key=a&&a.dataset&&a.dataset.b;const y=window.scrollY;render();window.scrollTo(0,y);
    if(key){const nx=document.querySelector(`[data-b="${CSS.escape(key)}"]`);if(nx)nx.focus({preventScroll:true});}},0);});

// ===================== Import / export =====================
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
window.exportJSON=()=>download(`importacao_backup_${hoje()}.json`,JSON.stringify(db,null,1),'application/json');
window.importJSON=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.processos))throw new Error('arquivo não é um backup deste sistema');
  if(!d.v){alert('Backup da versão 1: os processos serão importados sem vínculo com pedidos.');fromV1(d);}
  if(!confirm(`Restaurar backup com ${d.processos.length} embarque(s) e ${(d.pedidos||[]).length} pedido(s)? Os dados atuais serão substituídos.`))return;db=migrate(d);save();go('painel');}catch(err){alert('Não foi possível ler o backup: '+err.message);}finally{el.value='';}};r.readAsText(f);};
const cnum=v=>v==null||v===''?'':String(Math.round(v*100)/100).replace('.',',');
function csv(name,head,rows){const q=x=>{const s=String(x??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  download(name,'﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function parseCSV(txt){return txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/;|\t/).map(s=>s.trim().replace(/^"|"$/g,'')));}
const pnum=s=>{s=String(s||'').trim();if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=Number(s);return isNaN(v)?null:v;};
const pdate=s=>{s=String(s||'').trim();let m;if((m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/)))return `${m[3]}-${m[2]}-${m[1]}`;if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);return null;};
window.importNCM=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const R=parseCSV(r.result);let nv=0,up=0;
  R.forEach(c=>{if(!/\d{4}/.test(c[0]||''))return;let x=ncmRec(c[0]);if(!x){x={id:uid(),codigo:c[0].trim()};db.ncms.push(x);nv++;}else up++;
    if(c[1])x.descricao=c[1];['ii','ipi','pis','cofins'].forEach((k,i)=>{const v=pnum(c[i+2]);if(v!=null)x[k]=v;});x.atualizado=hoje();});
  save();render();alert(`NCMs: ${nv} incluída(s), ${up} atualizada(s).`);el.value='';};r.readAsText(f);};
window.importStatus=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const R=parseCSV(r.result);let ok=0;const err=[];
  const evMap=e=>{e=(e||'').toLowerCase();if(e==='eta'||e==='etd')return e;const s=STAGES.find(s=>s.k===e||s.t.toLowerCase().includes(e)||e.includes(s.k));return s?s.k:null;};
  R.forEach((c,i)=>{const ref=(c[0]||'').toLowerCase();if(!ref||ref==='referencia')return;const p=db.processos.find(p=>[p.numero,p.conhecimento,p.invoice].some(x=>x&&x.toLowerCase()===ref)||(p.containers||'').toLowerCase().includes(ref));
    const k=evMap(c[1]),d=pdate(c[2]);if(!p||!k||!d){err.push(`linha ${i+1}`);return;}
